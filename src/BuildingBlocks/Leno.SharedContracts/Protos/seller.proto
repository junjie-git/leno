syntax = "proto3";
package leno.seller.v1;
option csharp_namespace = "Leno.SharedContracts.Grpc.Seller.V1";

service SellerInternalService {
  rpc GetSellerInfo(GetSellerInfoRequest) returns (SellerInfo);
  rpc GetShopInfo(GetShopInfoRequest) returns (ShopInfo);
  rpc ValidateSellerOwnership(ValidateSellerOwnershipRequest) returns (ValidateSellerOwnershipResponse);
}

message GetSellerInfoRequest { string seller_id = 1; }
message SellerInfo {
  string seller_id = 1;
  string name = 2;
  string status = 3;
  int64 shop_id = 4 [deprecated = true];
  // Guid→string 迁移新增 string ID 字段；新客户端优先读 shop_id_str
  string shop_id_str = 5;
}
message GetShopInfoRequest {
  int64 shop_id = 1 [deprecated = true];
  string shop_id_str = 2;
}
message ShopInfo {
  int64 shop_id = 1 [deprecated = true];
  string name = 2;
  string status = 3;
  string seller_id = 4;
  // Guid→string 迁移新增 string ID 字段
  string shop_id_str = 5;
}
message ValidateSellerOwnershipRequest {
  string seller_id = 1;
  string resource_type = 2;
  string resource_id = 3;
}
message ValidateSellerOwnershipResponse { bool is_valid = 1; }
