syntax = "proto3";
package leno.points.v1;
option csharp_namespace = "Leno.SharedContracts.Grpc.Points.V1";

service PointsInternalService {
  rpc TrialOffset(TrialOffsetRequest) returns (TrialOffsetResponse);
  rpc Freeze(FreezeRequest) returns (FreezeResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  rpc GetPointsBalance(GetPointsBalanceRequest) returns (PointsBalance);
}

message TrialOffsetRequest {
  string user_id = 1;
  int32 points_to_use = 2;
}
message TrialOffsetResponse {
  int64 offset_cents = 1;
  bool success = 2;
}
message FreezeRequest {
  string user_id = 1;
  string order_id = 2;
  int32 points_to_use = 3;
}
message FreezeResponse { bool success = 1; }
message ReleaseRequest { string order_id = 1; }
message ReleaseResponse { bool success = 1; }
message ConfirmRequest { string order_id = 1; }
message ConfirmResponse { bool success = 1; }
message GetPointsBalanceRequest { string user_id = 1; }
message PointsBalance {
  int32 available = 1;
  int32 frozen = 2;
  int32 total = 3;
}
