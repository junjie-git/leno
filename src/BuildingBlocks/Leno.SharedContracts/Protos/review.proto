syntax = "proto3";
package leno.review.v1;
option csharp_namespace = "Leno.SharedContracts.Grpc.Review.V1";

service ReviewInternalService {
  rpc GetProductRating(GetProductRatingRequest) returns (ProductRating);
  rpc GetOrderReviews(GetOrderReviewsRequest) returns (OrderReviews);
  rpc GetShopReviewStatistics(GetShopReviewStatisticsRequest) returns (ShopReviewStatistics);
}

message GetProductRatingRequest {
  reserved 1;
  reserved "spu_id";
  string spu_id_str = 2;
}
message ProductRating {
  reserved 1;
  reserved "spu_id";
  double average_rating = 2;
  int32 total_count = 3;
  int32 positive_count = 4;
  // Guid→string 迁移权威字段（int64 双字段已删除，C3 2026-09-24）
  string spu_id_str = 5;
}
message GetOrderReviewsRequest { string order_id = 1; }
message OrderReviews { repeated ReviewSummary reviews = 1; }
message ReviewSummary {
  string review_id = 1;
  reserved 2;
  reserved "spu_id";
  int32 rating = 3;
  string content = 4;
  string created_at = 5;
  // Guid→string 迁移权威字段
  string spu_id_str = 6;
}
message GetShopReviewStatisticsRequest {
  // 店铺标识（Guid.ToString()）
  string shop_id = 1;
}
message ShopReviewStatistics {
  // 店铺标识（Guid.ToString()）
  string shop_id = 1;
  // 累计评价总数
  int32 total_reviews = 2;
  // 平均评分（1-5）
  double average_rating = 3;
  // 五星评价数
  int32 five_star_reviews = 4;
  // 一星评价数
  int32 one_star_reviews = 5;
}
