syntax = "proto3";
package leno.order.v1;
option csharp_namespace = "Leno.SharedContracts.Grpc.Order.V1";

service OrderInternalService {
  rpc GetOrderStatus(GetOrderStatusRequest) returns (OrderStatus);
  rpc GetOrderDetail(GetOrderDetailRequest) returns (OrderDetail);
  rpc GetSellerOrders(GetSellerOrdersRequest) returns (SellerOrders);
  rpc GetOrderSellerId(GetOrderSellerIdRequest) returns (GetOrderSellerIdResponse);
  // BE-3 数据导出：销售汇总与订单明细查询（按店铺 + 时间范围）
  rpc GetSalesSummaryForExport(ExportDataRequest) returns (ExportDataResponse);
  rpc GetOrderDetailForExport(ExportDataRequest) returns (ExportDataResponse);
}

message GetOrderStatusRequest { string order_id = 1; }
message OrderStatus {
  string order_id = 1;
  string status = 2;
  string payment_status = 3;
  string shipping_status = 4;
  // M4 双轨方案新增字段
  optional string user_id = 5;
  optional int64 completed_at = 6;
  optional int64 created_at = 7;
  optional int64 cancelled_at = 8;
  optional string seller_id = 9;
  repeated OrderItem items = 10;
}
message GetOrderDetailRequest { string order_id = 1; }
message OrderDetail {
  string order_id = 1;
  string user_id = 2;
  int64 total_cents = 3;
  string status = 4;
  repeated OrderItem items = 5;
}
message OrderItem {
  int64 sku_id = 1 [deprecated = true];
  int32 quantity = 2;
  int64 unit_price_cents = 3;
  // M4 双轨方案新增字段
  optional string sku_name = 4;
  optional int64 sub_total_cents = 5;
  // Guid→string 迁移新增 string ID 字段
  string sku_id_str = 6;
  // 合并审计 3.5：补全 order_line_id 与 spu_id 字段，避免静默 Guid.Empty
  optional string order_line_id = 7;
  optional string spu_id = 8;
}
message GetSellerOrdersRequest {
  string seller_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message SellerOrders {
  repeated OrderSummary orders = 1;
  int32 total = 2;
}
message OrderSummary {
  string order_id = 1;
  string status = 2;
  int64 total_cents = 3;
  string created_at = 4;
}
message GetOrderSellerIdRequest {
  int64 order_id = 1 [deprecated = true];
  string order_id_str = 2;
}

message GetOrderSellerIdResponse {
  int64 seller_id = 1 [deprecated = true];
  string seller_id_str = 2;
}

// BE-3 数据导出请求（按店铺 + ISO 8601 时间范围）
message ExportDataRequest {
  string shop_id_str = 1;
  string start_date = 2;
  string end_date = 3;
}

// BE-3 数据导出行（map<string, string> 兼容任意列）
message ExportDataRow {
  map<string, string> values = 1;
}

// BE-3 数据导出响应（表头 + 数据行）
message ExportDataResponse {
  repeated string headers = 1;
  repeated ExportDataRow rows = 2;
}
