syntax = "proto3";
package leno.system.v1;
option csharp_namespace = "Leno.SharedContracts.Grpc.System.V1";

service SystemInternalService {
  rpc GetFeatureFlag(GetFeatureFlagRequest) returns (FeatureFlag);
  rpc GetSystemConfig(GetSystemConfigRequest) returns (SystemConfig);
  rpc RecordAuditLog(RecordAuditLogRequest) returns (RecordAuditLogResponse);
}

message GetFeatureFlagRequest { string flag_name = 1; }
message FeatureFlag {
  string name = 1;
  bool enabled = 2;
  string description = 3;
}
message GetSystemConfigRequest { string config_key = 1; }
message SystemConfig {
  string key = 1;
  string value = 2;
  string description = 3;
}
message RecordAuditLogRequest {
  string user_id = 1;
  string action = 2;
  string resource_type = 3;
  string resource_id = 4;
  string detail = 5;
  string ip_address = 6;
}
message RecordAuditLogResponse { bool success = 1; }
