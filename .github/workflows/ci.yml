name: Leno Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Leno.slnx
      - name: Build
        run: dotnet build Leno.slnx --configuration Release --no-restore
      - name: Check placeholders
        run: bash scripts/check-placeholders.sh
      - name: Unit tests with coverage
        run: dotnet test Leno.slnx --configuration Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.0 || true
          reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./CoverageReport -reporttypes:"Html;Cobertura;JsonSummary"
      - name: Check coverage thresholds
        run: pwsh scripts/check-coverage.ps1 -CoverageResultsPath ./CoverageReport/
      - name: Check coverage thresholds by layer (M5.5)
        run: |
          chmod +x scripts/check-coverage-threshold.sh
          bash scripts/check-coverage-threshold.sh ./TestResults
        continue-on-error: true  # M5.5 阶段 1：先 warning（true），阶段 2：阻断（false）
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport

  integration-tests:
    name: 集成测试 (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-solution
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Leno.slnx

      - name: Build
        run: dotnet build Leno.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: Run integration tests (Category=Integration)
        run: dotnet test Leno.slnx --no-build --configuration Release --filter "Category=Integration" --collect:"XPlat Code Coverage" -p:TreatWarningsAsErrors=false
        env:
          # Testcontainers 需要访问 Docker socket
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/TestResults/
            **/coverage.cobertura.xml
          retention-days: 7

  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: 'UserAuth'
            path: 'src/Services/UserAuth/Leno.UserAuth.Api/Leno.UserAuth.Api.csproj'
          - name: 'Product'
            path: 'src/Services/Product/Leno.Product.Api/Leno.Product.Api.csproj'
          - name: 'Cart'
            path: 'src/Services/Cart/Leno.Cart.Api/Leno.Cart.Api.csproj'
          - name: 'Order'
            path: 'src/Services/Order/Leno.Order.Api/Leno.Order.Api.csproj'
          - name: 'Promotion'
            path: 'src/Services/Promotion/Leno.Promotion.Api/Leno.Promotion.Api.csproj'
          - name: 'Payment'
            path: 'src/Services/Payment/Leno.Payment.Api/Leno.Payment.Api.csproj'
          - name: 'PointsMembership'
            path: 'src/Services/PointsMembership/Leno.PointsMembership.Api/Leno.PointsMembership.Api.csproj'
          - name: 'ReviewAfterSales'
            path: 'src/Services/ReviewAfterSales/Leno.ReviewAfterSales.Api/Leno.ReviewAfterSales.Api.csproj'
          - name: 'SellerShop'
            path: 'src/Services/SellerShop/Leno.SellerShop.Api/Leno.SellerShop.Api.csproj'
          - name: 'Notification'
            path: 'src/Services/Notification/Leno.Notification.Api/Leno.Notification.Api.csproj'
          - name: 'SystemAdmin'
            path: 'src/Services/SystemAdmin/Leno.SystemAdmin.Api/Leno.SystemAdmin.Api.csproj'
          - name: 'ApiGateway'
            path: 'src/ApiGateway/Leno.ApiGateway/Leno.ApiGateway.csproj'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build ${{ matrix.project.name }}
        run: dotnet build ${{ matrix.project.path }} --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-services
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: 'UserAuth'
            dockerfile: 'src/Services/UserAuth/Leno.UserAuth.Api/Dockerfile'
          - name: 'Product'
            dockerfile: 'src/Services/Product/Leno.Product.Api/Dockerfile'
          - name: 'Cart'
            dockerfile: 'src/Services/Cart/Leno.Cart.Api/Dockerfile'
          - name: 'Order'
            dockerfile: 'src/Services/Order/Leno.Order.Api/Dockerfile'
          - name: 'Promotion'
            dockerfile: 'src/Services/Promotion/Leno.Promotion.Api/Dockerfile'
          - name: 'Payment'
            dockerfile: 'src/Services/Payment/Leno.Payment.Api/Dockerfile'
          - name: 'PointsMembership'
            dockerfile: 'src/Services/PointsMembership/Leno.PointsMembership.Api/Dockerfile'
          - name: 'ReviewAfterSales'
            dockerfile: 'src/Services/ReviewAfterSales/Leno.ReviewAfterSales.Api/Dockerfile'
          - name: 'SellerShop'
            dockerfile: 'src/Services/SellerShop/Leno.SellerShop.Api/Dockerfile'
          - name: 'Notification'
            dockerfile: 'src/Services/Notification/Leno.Notification.Api/Dockerfile'
          - name: 'SystemAdmin'
            dockerfile: 'src/Services/SystemAdmin/Leno.SystemAdmin.Api/Dockerfile'
          - name: 'ApiGateway'
            dockerfile: 'src/ApiGateway/Leno.ApiGateway/Dockerfile'
    steps:
      - uses: actions/checkout@v4
      - name: Docker build ${{ matrix.service.name }}
        run: docker build -f ${{ matrix.service.dockerfile }} -t leno-${{ matrix.service.name }}:ci .

  validate-compose:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker-compose config > /dev/null

  migration-check:
    name: EF Core Migrations 同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Restore
        run: dotnet restore Leno.slnx
      - name: Build
        run: dotnet build Leno.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=false
      - name: Check migrations sync (模型变更必须配套 migration)
        run: pwsh scripts/check-migrations.ps1
      - name: Generate idempotent migration SQL scripts
        run: pwsh scripts/generate-migration-scripts.ps1
      - name: Upload migration SQL scripts
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts
          path: scripts/migrations/*.sql
          retention-days: 14
      - name: Staging 空库执行迁移验证
        env:
          SA_PASSWORD: Leno@Test123!
        run: |
          docker run -d --name sqlserver-test \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD=$SA_PASSWORD \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2019-latest
          sleep 60
          for f in scripts/migrations/*.sql; do
            /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P $SA_PASSWORD -C -i "$f"
          done
          docker rm -f sqlserver-test

  proto-lint-breaking:
    name: Proto Lint & Breaking (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf lint
      - name: buf breaking (against main)
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=src/BuildingBlocks/Leno.SharedContracts"
        if: github.event_name == 'pull_request'

  generate-grpc-contracts:
    name: Verify gRPC C# Contracts (buf generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Generate C# code
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf generate

      - name: Check for uncommitted generated files
        run: |
          cd src/BuildingBlocks/Leno.SharedContracts.Grpc
          if [ -n "$(git status --porcelain Generated/)" ]; then
            echo "::error::Generated/ files are out of date. Run 'buf generate' locally and commit changes."
            git diff --stat Generated/
            exit 1
          fi

      - name: Verify Grpc project compiles
        run: dotnet build src/BuildingBlocks/Leno.SharedContracts.Grpc/Leno.SharedContracts.Grpc.csproj --configuration Release

  staging-integration-tests:
    name: Staging 集成测试 (docker-compose)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start infrastructure (docker-compose)
        run: docker compose up -d sqlserver redis rabbitmq elasticsearch consul jaeger prometheus grafana alertmanager

      - name: Wait for infrastructure ready
        run: |
          for i in {1..60}; do
            if docker compose ps | grep -q "healthy"; then break; fi
            sleep 5
          done

      - name: Apply EF migrations
        run: |
          # 逐 BC 执行 dotnet ef database update
          for bc in UserAuth Product Cart Order Promotion ReviewAfterSales PointsMembership Payment Notification SellerShop SystemAdmin; do
            dotnet ef database update \
              --project src/Services/$bc/Leno.$bc.Infrastructure \
              --startup-project src/Services/$bc/Leno.$bc.Api
          done

      - name: Run integration tests (Category=Integration)
        run: dotnet test Leno.slnx --configuration Release --filter "Category=Integration" --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Staging

      - name: Cleanup
        if: always()
        run: docker compose down -v
