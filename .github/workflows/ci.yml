name: Leno Platform CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

# 镜像推送 GHCR 需要 packages:write；其余 job 仅需 contents:read
permissions:
  contents: read
  packages: write

# 镜像仓库参数化（阶段 3）：REGISTRY + IMAGE_PREFIX 统一在顶部定义，便于切换 registry。
# IMAGE_PREFIX 仅含 <owner>/，服务名由 matrix 拼接：ghcr.io/<owner>/leno-<service>
# （docker/metadata-action 会自动将镜像名转为小写，满足 GHCR 命名要求）
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/

jobs:
  build-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Leno.slnx
      - name: Build
        run: dotnet build Leno.slnx --configuration Release --no-restore
      - name: Check placeholders
        run: bash scripts/check-placeholders.sh
      - name: Unit tests with coverage
        run: dotnet test Leno.slnx --configuration Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.0 || true
          reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./CoverageReport -reporttypes:"Html;Cobertura;JsonSummary"
      - name: Check coverage thresholds
        run: pwsh scripts/check-coverage.ps1 -CoverageResultsPath ./CoverageReport/
      - name: Check coverage thresholds by layer (M5.5)
        run: |
          chmod +x scripts/check-coverage-threshold.sh
          bash scripts/check-coverage-threshold.sh ./TestResults
        continue-on-error: true  # M5.5 阶段 1：先 warning（true），阶段 2：阻断（false）
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport

  integration-tests:
    name: 集成测试 (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-solution
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Leno.slnx

      - name: Build
        run: dotnet build Leno.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=false

      - name: Run integration tests (Category=Integration)
        run: dotnet test Leno.slnx --no-build --configuration Release --filter "Category=Integration" --collect:"XPlat Code Coverage" -p:TreatWarningsAsErrors=false
        env:
          # Testcontainers 需要访问 Docker socket
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/TestResults/
            **/coverage.cobertura.xml
          retention-days: 7

  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: 'UserAuth'
            path: 'src/Services/UserAuth/Leno.UserAuth.Api/Leno.UserAuth.Api.csproj'
          - name: 'Product'
            path: 'src/Services/Product/Leno.Product.Api/Leno.Product.Api.csproj'
          - name: 'Cart'
            path: 'src/Services/Cart/Leno.Cart.Api/Leno.Cart.Api.csproj'
          - name: 'Order'
            path: 'src/Services/Order/Leno.Order.Api/Leno.Order.Api.csproj'
          - name: 'Promotion'
            path: 'src/Services/Promotion/Leno.Promotion.Api/Leno.Promotion.Api.csproj'
          - name: 'Payment'
            path: 'src/Services/Payment/Leno.Payment.Api/Leno.Payment.Api.csproj'
          - name: 'PointsMembership'
            path: 'src/Services/PointsMembership/Leno.PointsMembership.Api/Leno.PointsMembership.Api.csproj'
          - name: 'ReviewAfterSales'
            path: 'src/Services/ReviewAfterSales/Leno.ReviewAfterSales.Api/Leno.ReviewAfterSales.Api.csproj'
          - name: 'SellerShop'
            path: 'src/Services/SellerShop/Leno.SellerShop.Api/Leno.SellerShop.Api.csproj'
          - name: 'Notification'
            path: 'src/Services/Notification/Leno.Notification.Api/Leno.Notification.Api.csproj'
          - name: 'SystemAdmin'
            path: 'src/Services/SystemAdmin/Leno.SystemAdmin.Api/Leno.SystemAdmin.Api.csproj'
          - name: 'ApiGateway'
            path: 'src/ApiGateway/Leno.ApiGateway/Leno.ApiGateway.csproj'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build ${{ matrix.project.name }}
        run: dotnet build ${{ matrix.project.path }} --configuration Release

  # ===========================================================================
  # 阶段 3：docker build + push（GHCR）
  # - PR：只构建不推送（验证 Dockerfile 可构建）
  # - push 到 main/develop/dev 或手动触发：推送到 ghcr.io/<owner>/leno-<service>
  #   tag 策略：git sha（短）+ 分支名；main 分支额外打 latest
  # ===========================================================================
  docker-build:
    runs-on: ubuntu-latest
    needs: build-services
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: 'UserAuth'
            dockerfile: 'src/Services/UserAuth/Leno.UserAuth.Api/Dockerfile'
          - name: 'Product'
            dockerfile: 'src/Services/Product/Leno.Product.Api/Dockerfile'
          - name: 'Cart'
            dockerfile: 'src/Services/Cart/Leno.Cart.Api/Dockerfile'
          - name: 'Order'
            dockerfile: 'src/Services/Order/Leno.Order.Api/Dockerfile'
          - name: 'Promotion'
            dockerfile: 'src/Services/Promotion/Leno.Promotion.Api/Dockerfile'
          - name: 'Payment'
            dockerfile: 'src/Services/Payment/Leno.Payment.Api/Dockerfile'
          - name: 'PointsMembership'
            dockerfile: 'src/Services/PointsMembership/Leno.PointsMembership.Api/Dockerfile'
          - name: 'ReviewAfterSales'
            dockerfile: 'src/Services/ReviewAfterSales/Leno.ReviewAfterSales.Api/Dockerfile'
          - name: 'SellerShop'
            dockerfile: 'src/Services/SellerShop/Leno.SellerShop.Api/Dockerfile'
          - name: 'Notification'
            dockerfile: 'src/Services/Notification/Leno.Notification.Api/Dockerfile'
          - name: 'SystemAdmin'
            dockerfile: 'src/Services/SystemAdmin/Leno.SystemAdmin.Api/Dockerfile'
          - name: 'ApiGateway'
            dockerfile: 'src/ApiGateway/Leno.ApiGateway/Dockerfile'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 生成镜像 tag：sha(短) + 分支名 + (main) latest；同时将镜像名统一转小写
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}leno-${{ matrix.service.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # push 条件：push 事件（触发分支已限定 main/develop/dev）或手动触发；PR 只构建不推送
      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-compose:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        # ubuntu-latest runner 已移除 docker-compose v1 独立命令（exit 127），
        # 统一使用 Docker Compose v2 插件语法 `docker compose`
        run: docker compose config > /dev/null

  # ===========================================================================
  # 阶段 3：迁移 SQL 同步检查（P0 遗留技术债）
  #
  # 生产迁移 Job 从 chart files 目录（deploy/helm/leno/files/migrations/）读取 SQL，
  # 与 scripts/migrations/ 是两份拷贝。若两者不同步，CI 验证的是新 SQL、
  # 生产执行的却是旧 SQL。本 job 强制两个目录内容一致，不一致即 fail 并列出差异。
  # 作为 migration-check 的前置 job 执行。
  # ===========================================================================
  migration-files-sync:
    name: 迁移 SQL 同步检查 (scripts vs chart files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts/migrations 与 chart files/migrations 同步
        run: |
          set -euo pipefail
          SRC="scripts/migrations"
          DST="deploy/helm/leno/files/migrations"
          echo "源目录: $SRC"
          echo "目标目录: $DST"

          fail=0

          # 1) 双向存在性检查：任何一侧多出/缺失文件都视为不同步
          for f in "$SRC"/*.sql; do
            base=$(basename "$f")
            if [ ! -f "$DST/$base" ]; then
              echo "::error file=$f::chart files 目录缺失同步文件: deploy/helm/leno/files/migrations/$base"
              fail=1
            fi
          done
          for f in "$DST"/*.sql; do
            base=$(basename "$f")
            if [ ! -f "$SRC/$base" ]; then
              echo "::error file=$f::scripts/migrations 目录缺失对应文件: scripts/migrations/$base"
              fail=1
            fi
          done

          # 2) 内容差异检查（-r 覆盖子目录/双向差异）
          if ! diff -r "$SRC" "$DST"; then
            echo "::error::迁移 SQL 两个目录内容不一致，差异文件清单见上方 diff 输出"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "同步方式：将 scripts/migrations/*.sql 拷贝到 deploy/helm/leno/files/migrations/（或运行 scripts/generate-migration-scripts.ps1 后同步）"
            exit 1
          fi
          echo "两个目录完全一致 ✓"

  migration-check:
    name: EF Core Migrations 同步检查
    runs-on: ubuntu-latest
    needs: migration-files-sync
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Restore
        run: dotnet restore Leno.slnx
      - name: Build
        run: dotnet build Leno.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=false
      - name: Check migrations sync (模型变更必须配套 migration)
        env:
          # 设计期工厂（DesignTimeDbContextFactoryBase）从该变量读取连接串。
          # has-pending-model-changes 只比较模型与迁移快照、不会真正连接数据库，
          # 因此注入占位连接串即可（未设置时工厂会 fail-fast 抛异常）。
          LENO_DESIGNTIME_CONNECTION_STRING: 'Server=localhost,1433;Database=LenoDesignTime;User Id=sa;Password=DesignTimeOnly_NotARealPassword!;TrustServerCertificate=True'
        run: pwsh scripts/check-migrations.ps1
      - name: Generate idempotent migration SQL scripts
        env:
          # 同上：migrations script 生成 SQL 亦为设计期行为，不连接数据库。
          # 注：dotnet-ef 工具版本已与 EF runtime 对齐（均为 10.0.0，见上方版本回显步骤）。
          # 后续升级 EF 时把下方 --version 与 Directory.Build.props 的
          # EntityFrameworkCoreVersion 同步更新即可。
          LENO_DESIGNTIME_CONNECTION_STRING: 'Server=localhost,1433;Database=LenoDesignTime;User Id=sa;Password=DesignTimeOnly_NotARealPassword!;TrustServerCertificate=True'
        run: pwsh scripts/generate-migration-scripts.ps1
      - name: Upload migration SQL scripts
        uses: actions/upload-artifact@v4
        with:
          name: migration-scripts
          path: scripts/migrations/*.sql
          retention-days: 14
      - name: Staging 空库执行迁移验证
        env:
          SA_PASSWORD: Leno@Test123!
        run: |
          # mssql/server:2019-latest 镜像已不再内置 /opt/mssql-tools18/bin/sqlcmd（exit 127），
          # 改为下载 go-sqlcmd v1.10.0 独立二进制（sha256 校验防篡改，--retry 防下载抖动）。
          curl -fSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/sqlcmd-linux-amd64.tar.bz2 \
            "https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2"
          echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  /tmp/sqlcmd-linux-amd64.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/sqlcmd-linux-amd64.tar.bz2 -C /usr/local/bin sqlcmd
          sqlcmd --version

          docker run -d --name sqlserver-test \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD=$SA_PASSWORD \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2019-latest
          # 无论如何清理容器，避免 runner 残留
          trap 'docker rm -f sqlserver-test' EXIT

          # 就绪探测：固定 sleep 60 不可靠（慢 runner 上会假失败），
          # 改为 SELECT 1 重试（30 次 x 5s），全部失败则显式报错退出
          ready=0
          for i in $(seq 1 30); do
            if sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::SQL Server 容器在 150s 内未就绪"
            docker logs sqlserver-test | tail -50
            exit 1
          fi

          # -b：任一 SQL 错误使 sqlcmd 非零退出（默认模式只打印错误不失败，
          # 导致 run #9 迁移脚本错误被吞、step 假绿）
          #
          # 每个服务的迁移必须在各自独立的数据库上执行（生产拓扑即每服务一库）。
          # 此前所有脚本堆进同一空库顺序执行：各服务的 BaseDbContext 共享 outbox_messages
          # 发件箱表，第二个服务（identity-accesscontrol）CREATE TABLE 即撞 Msg 2714
          # "There is already an object named 'outbox_messages'"（run #10 实证）。
          # 按文件名首个 '-' 前的服务前缀分库（cart-initial/cart-sku-snapshot-backfill
          # 自然同属 cart 库，backfill 依赖 initial 的表结构）；每个脚本自带
          # __EFMigrationsHistory 幂等防护，在独立空库上语义与生产一致。
          for f in scripts/migrations/*.sql; do
            svc="$(basename "$f" | cut -d- -f1)"
            echo "Executing $f (database: $svc)"
            sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b \
              -Q "IF DB_ID(N'$svc') IS NULL CREATE DATABASE [$svc]"
            sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b -d "$svc" -i "$f"
          done

  proto-lint-breaking:
    name: Proto Lint & Breaking (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # bufbuild/buf-setup-action@v1 内部匿名调用 GitHub API 获取最新版本，
      # CI runner 高频触发时撞 60 req/h 匿名限流导致偶发失败（run #9 根因）。
      # 改为直链固定版本 + sha256 校验，确定性且不依赖 GitHub API 配额。
      - name: Setup Buf CLI (pinned v1.72.0, direct download)
        run: |
          BUF_VERSION=v1.72.0
          curl -fSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          echo "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af  /usr/local/bin/buf" | sha256sum -c -
          chmod +x /usr/local/bin/buf
          buf --version
      - name: buf lint
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf lint
      - name: buf breaking (against main)
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=src/BuildingBlocks/Leno.SharedContracts"
        if: github.event_name == 'pull_request'

  generate-grpc-contracts:
    name: Verify gRPC C# Contracts (buf generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Buf CLI (pinned v1.72.0, direct download)
        run: |
          BUF_VERSION=v1.72.0
          curl -fSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64"
          echo "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af  /usr/local/bin/buf" | sha256sum -c -
          chmod +x /usr/local/bin/buf
          buf --version

      - name: Generate C# code
        working-directory: src/BuildingBlocks/Leno.SharedContracts
        run: buf generate

      - name: Check for uncommitted generated files
        run: |
          cd src/BuildingBlocks/Leno.SharedContracts.Grpc
          if [ -n "$(git status --porcelain Generated/)" ]; then
            echo "::error::Generated/ files are out of date. Run 'buf generate' locally and commit changes."
            git diff --stat Generated/
            exit 1
          fi

      - name: Verify Grpc project compiles
        run: dotnet build src/BuildingBlocks/Leno.SharedContracts.Grpc/Leno.SharedContracts.Grpc.csproj --configuration Release

  staging-integration-tests:
    name: Staging 集成测试 (docker-compose)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start infrastructure (docker-compose)
        run: docker compose up -d sqlserver redis rabbitmq elasticsearch consul jaeger prometheus grafana alertmanager

      - name: Wait for infrastructure ready
        run: |
          for i in {1..60}; do
            if docker compose ps | grep -q "healthy"; then break; fi
            sleep 5
          done

      - name: Apply EF migrations
        run: |
          # 逐 BC 执行 dotnet ef database update
          for bc in UserAuth Product Cart Order Promotion ReviewAfterSales PointsMembership Payment Notification SellerShop SystemAdmin; do
            dotnet ef database update \
              --project src/Services/$bc/Leno.$bc.Infrastructure \
              --startup-project src/Services/$bc/Leno.$bc.Api
          done

      - name: Run integration tests (Category=Integration)
        run: dotnet test Leno.slnx --configuration Release --filter "Category=Integration" --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Staging

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # 阶段 4.10：Pact 跨 BC 契约测试
  #
  # DG-10 决策门约束：团队 Pact 培训完成前，本 job 设为 continue-on-error: true（非阻塞）。
  # 当前阶段仅完成样例契约（Order BC → Product BC SPU/SKU 查询）与基础设施搭建，
  # CI 强制集成（can-i-deploy 阻断部署）推迟到培训完成后将 continue-on-error 改为 false。
  #
  # 流程：Consumer 测试生成 pact →（可选）发布到 Pact Broker → Provider 验证 →（可选）can-i-deploy
  # Pact Broker 未配置 secrets 前，发布与 can-i-deploy 步骤自动跳过，不影响 Consumer/Provider 本地验证。
  # ===========================================================================
  pact-contract-tests:
    name: Pact 契约测试 (Consumer/Provider)
    runs-on: ubuntu-latest
    continue-on-error: true  # DG-10：培训完成前非阻塞，完成后改为 false 启用强制集成
    env:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1. Consumer 测试：生成 pact 契约文件至仓库根 pacts/
      - name: Run consumer tests (生成 pact 文件)
        run: dotnet test tests/Contracts/Leno.Contracts.Consumer.Tests --configuration Release --logger trx

      # 2. 发布 pact 到 Pact Broker（仅当 Broker secrets 已配置时执行）
      - name: Publish pacts to broker
        if: ${{ env.PACT_BROKER_URL != '' && env.PACT_BROKER_TOKEN != '' }}
        run: |
          docker run --rm -v $(pwd)/pacts:/pacts pactfoundation/pact-cli:latest \
            publish /pacts \
            --broker-base-url "$PACT_BROKER_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

      # 3. Provider 验证：读取本地 pact 文件验证 Product BC 契约遵从性
      - name: Verify provider contracts
        run: dotnet test tests/Contracts/Leno.Contracts.Provider.Tests --configuration Release --logger trx

      # 4. can-i-deploy 检查（仅当 Broker secrets 已配置时执行；DG-10 前仅作展示，不阻断）
      - name: Check can-i-deploy
        if: ${{ env.PACT_BROKER_URL != '' && env.PACT_BROKER_TOKEN != '' }}
        run: |
          docker run --rm pactfoundation/pact-cli:latest \
            broker can-i-deploy \
            --pacticipant "Order BC" \
            --version ${{ github.sha }} \
            --broker-base-url "$PACT_BROKER_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

      - name: Upload pact test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-test-results
          path: |
            **/TestResults/*.trx
            pacts/*.json
          retention-days: 14

  web-system-admin:
