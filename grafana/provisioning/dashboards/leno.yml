apiVersion: 1

providers:
  - name: Leno
    orgId: 1
    folder: Leno
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      files:
        - leno-gateway-dashboard.json
        - leno-business-services-dashboard.json
