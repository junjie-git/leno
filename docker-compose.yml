  # ==========================================================================
  # 2026-09-21 补入（A-1 拆分 / G4）：Identity / AccessControl / UserCenter
  # 此前 19 个 BC 中有 8 个无容器，其中这三个是 UserAuth 单体的拆分目标。
  # 注意：9 条路由与 user-auth-api 逐字冲突（api/auth、api/account、api/users/me 等），
  # 因此本三个服务与 user-auth-api **不能同时对外暴露**，切换须一次性完成。
  # 端口沿编号顺延（5151-5161 已被占用，网关为 8080）。
  # ==========================================================================
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Leno.Identity.Api/Dockerfile
    container_name: leno-identity-api
    ports:
      - "5162:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=identity-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
      - ConnectionStrings__IdentityDb=${LENO_DB_IDENTITY}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
      - ServiceUrls__AccessControlApi=http://access-control-api:8080
      # JWT RS256 签名私钥（PEM）。EnvironmentKms 优先读环境变量 JWT_RSA_PRIVATE_KEY_PEM，
      # 其值为空时才回退 appsettings 的 JwtSigning:RsaPrivateKeyPem；而 appsettings.json 中该键是
      # 未被展开的字面量 "${JWT_RSA_PRIVATE_KEY_PEM}"，若不注入真实 PEM，签发令牌会以
      # "No supported key formats were found" 失败（实测 /api/auth/register 400）。
      - JWT_RSA_PRIVATE_KEY_PEM=${JWT_RSA_PRIVATE_KEY_PEM}
      # BC 间 gRPC 走 access-control 的 HTTP/2 专用端口（5263，取自 deploy/services.manifest.json），
      # REST（UserAdminAppService 的 /api/admin/users/... 调用）仍走 8080。
      # 明文 HTTP/2（h2c）无法与 HTTP/1.1 共用同一 Kestrel 端点，必须拆端口。
      - AntiCorruption__GrpcEndpoints__AccessControl=http://access-control-api:5263
      # AccessControl 的 gRPC 服务端由 GrpcInternalKeyInterceptor 校验 x-internal-key，
      # 调用方（Identity 的 JwtTokenService）从同名键读取并注入该头，两侧必须一致。
      - AntiCorruption__TargetInternalApiKeys__AccessControl=${LENO_INTERNAL_API_KEY_SHARED}
      # 第三方登录密钥仅 Identity BC 需要
      - OAuth2__WeChat__AppId=${LENO_OAUTH_WECHAT_APPID}
      - OAuth2__WeChat__AppSecret=${LENO_OAUTH_WECHAT_APPSECRET}
      - OAuth2__Apple__ClientId=${LENO_OAUTH_APPLE_CLIENTID}
      - OAuth2__Apple__ClientSecret=${LENO_OAUTH_APPLE_CLIENTSECRET}
      # OAuth2:AesKey 为 Base64 编码的 32 字节密钥；PasswordHash:Pepper 为口令哈希胡椒
      - OAuth2__AesKey=${OAUTH2_AES_KEY}
      - PasswordHash__Pepper=${PASSWORD_PEPPER}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  access-control-api:
    build:
      context: .
      dockerfile: src/Services/AccessControl/Leno.AccessControl.Api/Dockerfile
    container_name: leno-access-control-api
    ports:
      - "5163:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=access-control-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
