  # ==========================================================================
  # 2026-09-21 补入（A3：剩余 5 个 BC 全部部署，DEC-4 决策）。
  # 端口沿 A-1 序列顺延（5162-5164 已占用），与 Helm values.yaml 的 httpPort 一致：
  #   inventory 5165 / points 5166 / membership 5167 / review 5168 / aftersales 5169
  # 注意：`points-api` 在此指新拆分的 Points BC（旧 PointsMembership 已更名
  # points-membership-api，见上）；EF 迁移与 initial SQL 已产出，迁移 Job 已启用。
  # ==========================================================================
  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/Leno.Inventory.Api/Dockerfile
    container_name: leno-inventory-api
    ports:
      - "5165:8080"
      # gRPC 内部服务（Order BC 同步预占/查询经此调用，双轨下线 DEC-4）
      - "5265:5265"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # gRPC 直连（E2E/Order）：两个端口均强制 HTTP/2 明文（h2c）
      # 注意：HTTP/1.1 客户端（curl 健康检查、/internal HTTP 调用方）在本地此模式下不可用
      - ASPNETCORE_URLS=http://+:8080;http://+:5265
      - Kestrel__EndpointDefaults__Protocols=Http2
      # 配置中心与内部鉴权（本机 compose 初始化；KV 由 kv-seed 灌入）
      - Consul__Url=http://consul:8500
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - ConnectionStrings__InventoryDb=${LENO_DB_INVENTORY}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      - Payment__Alipay__AppId=${LENO_PAYMENT_ALIPAY_APPID}
      - Payment__Alipay__PrivateKey=${LENO_PAYMENT_ALIPAY_PRIVATEKEY}
      - Payment__Alipay__PublicKey=${LENO_PAYMENT_ALIPAY_PUBLICKEY}
      - Payment__WeChatPay__AppId=${LENO_PAYMENT_WECHATPAY_APPID}
      - Payment__WeChatPay__MchId=${LENO_PAYMENT_WECHATPAY_MCHID}
      - Payment__WeChatPay__ApiKey=${LENO_PAYMENT_WECHATPAY_APIKEY}
      - SMS__ApiKey=${LENO_SMS_APIKEY}
      - SMS__ApiSecret=${LENO_SMS_APISECRET}
      - OAuth2__WeChat__AppId=${LENO_OAUTH_WECHAT_APPID}
      - OAuth2__WeChat__AppSecret=${LENO_OAUTH_WECHAT_APPSECRET}
      - OAuth2__Apple__ClientId=${LENO_OAUTH_APPLE_CLIENTID}
      - OAuth2__Apple__ClientSecret=${LENO_OAUTH_APPLE_CLIENTSECRET}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
