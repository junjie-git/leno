services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: leno-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # 密码从容器环境变量运行时读取，避免 docker inspect 直接可见
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  redis:
    image: redis:7-alpine
    container_name: leno-redis
    ports:
      # 仅绑定本机回环，避免局域网暴露；容器间经 leno-net 互通不受影响
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    environment:
      # 供健康检查在容器内运行时读取（$$ 转义，避免 compose 启动期展开）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-leno-redis-dev}
    # P0 安全加固：Redis 启用 requirepass（库存预占/秒杀配额/密码重置 token 均存于此，
    # 未授权访问即可读写）。未在 .env 设置 REDIS_PASSWORD 时回退到已公开的 dev 默认值，
    # 保证 compose 可独立启动，但连接串必须与之一致
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - leno-net

  consul:
    image: hashicorp/consul:1.18
    container_name: leno-consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leno-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: leno-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: leno-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: leno-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: leno-prometheus
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: leno-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - leno-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: leno-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/leno-gateway-dashboard.json:/var/lib/grafana/dashboards/leno-gateway-dashboard.json:ro
      - ./grafana/leno-business-services-dashboard.json:/var/lib/grafana/dashboards/leno-business-services-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
