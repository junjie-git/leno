# 16 个 API 与网关复用的健康检查探针。
# 依据：mcr.microsoft.com/dotnet/aspnet:10.0（Debian）运行镜像自带 /usr/bin/bash，
# 不含 curl / wget（已用 `docker run --entrypoint sh ... command -v curl/wget/bash` 实测确认）。
# 因此用 bash 的内建 /dev/tcp 直接发起 HTTP/1.1 请求并校验状态行 200：
#   - 不修改 17 个 Dockerfile、不重建镜像、不在运行时安装额外包；
#   - 非 root 用户（镜像内 APP_UID 1654）可直接使用；
#   - 校验的是真实 HTTP 状态码，而不是端口连通性，健康判定可信。
x-api-healthcheck: &api-healthcheck
  test:
    - CMD-SHELL
    - >-
      bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
  interval: 10s
  timeout: 5s
  retries: 12
  # /health/ready 覆盖 EF 迁移、Quartz 建表、Redis / Elasticsearch / RabbitMQ 依赖，
  # 冷启动（尤其首次建库 + 迁移）耗时明显长于 /health/live，故把启动观察期放宽到 240s；
  # 进入 steady state 后仍按 interval=10s 探测，依赖故障可在约 2 分钟内反映为 unhealthy。
  start_period: 240s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: leno-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      # 本地 compose 使用 Developer 版：Notification 的迁移包含 CREATE INDEX ... WITH (ONLINE = ON, FILLFACTOR = 90)
      # （见 20260723131843_AddIxNotificationRecordsUserIsreadChannel），该语法仅 Enterprise/Developer 支持，
      # Express 版会以错误 1712（Online index operations can only be performed in Enterprise edition）中断迁移，
      # 导致 notification-api 启动即崩溃。Developer 版对开发/测试免费且功能等同 Enterprise，生产由 Helm 提供 Enterprise。
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # 密码从容器环境变量运行时读取，避免 docker inspect 直接可见
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  # Quartz.NET 调度库一次性初始化：QRTZ_* 表由 Quartz 自有 DDL 管理，不纳入 EF 迁移，
  # 且 16 个 API 的 QuartzHostedService 在启动时即连接调度库（表缺失会导致宿主启动失败）。
  # 脚本与 Helm scheduler-migration-job 使用的是同一份幂等 DDL。
  scheduler-db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: leno-scheduler-db-init
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - ./deploy/helm/leno/files/migrations/scheduler-quartz.sql:/migrations/scheduler-quartz.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        ready=0
        for i in $$(seq 1 60); do
          if "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
            ready=1
            break
          fi
          echo "等待 sqlserver 就绪（$$i/60）..."
          sleep 2
        done
        if [ "$$ready" -ne 1 ]; then
          echo "sqlserver 在 120 秒内未就绪" >&2
          exit 1
        fi
        "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N'LenoScheduler') IS NULL CREATE DATABASE LenoScheduler;"
        "$$SQLCMD" -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -d LenoScheduler -C -b -f 65001 -i /migrations/scheduler-quartz.sql
        echo "Quartz 调度库初始化完成。"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - leno-net

  redis:
    image: redis:7-alpine
    container_name: leno-redis
    ports:
      # 仅绑定本机回环，避免局域网暴露；容器间经 leno-net 互通不受影响
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    environment:
      # 供健康检查在容器内运行时读取（$$ 转义，避免 compose 启动期展开）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-leno-redis-dev}
    # P0 安全加固：Redis 启用 requirepass（库存预占/秒杀配额/密码重置 token 均存于此，
    # 未授权访问即可读写）。未在 .env 设置 REDIS_PASSWORD 时回退到已公开的 dev 默认值，
    # 保证 compose 可独立启动，但连接串必须与之一致
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - leno-net

  consul:
    image: hashicorp/consul:1.18
    container_name: leno-consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leno-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: leno-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: leno-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: leno-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: leno-prometheus
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: leno-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - leno-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: leno-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/leno-gateway-dashboard.json:/var/lib/grafana/dashboards/leno-gateway-dashboard.json:ro
      - ./grafana/leno-business-services-dashboard.json:/var/lib/grafana/dashboards/leno-business-services-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - leno-net

  product-api:
    build:
      context: .
      dockerfile: src/Services/Product/Leno.Product.Api/Dockerfile
    container_name: leno-product-api
    ports:
      - "5152:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=product-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      # ACL gRPC 独立端口（manifest grpcPort=5252）：REST 走 8080/HTTP1，gRPC 走 5252/HTTP2（h2c 无 ALPN，不能共用端口）
      - Kestrel__Endpoints__Rest__Url=http://+:8080
      - Kestrel__Endpoints__Rest__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5252
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
      # 本地冒烟：启动时执行 EF 迁移（生产由 helm migration-job 负责）
      - Database__MigrateOnStartup=true
      - ConnectionStrings__ProductDb=${LENO_DB_PRODUCT}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  cart-api:
    build:
      context: .
      dockerfile: src/Services/Cart/Leno.Cart.Api/Dockerfile
    container_name: leno-cart-api
    ports:
      - "5153:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=cart-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      # ACL gRPC 独立端口（manifest grpcPort=5253）：REST 走 8080/HTTP1，gRPC 走 5253/HTTP2
      - Kestrel__Endpoints__Rest__Url=http://+:8080
      - Kestrel__Endpoints__Rest__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5253
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
      - ConnectionStrings__CartDb=${LENO_DB_CART}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
      - ServiceUrls__ProductApi=http://product-api:8080
      - AntiCorruption__GrpcEndpoints__Product=http://product-api:5252
      - AntiCorruption__TargetInternalApiKeys__Product=${LENO_INTERNAL_API_KEY_SHARED}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  order-api:
    build:
      context: .
      dockerfile: src/Services/Order/Leno.Order.Api/Dockerfile
    container_name: leno-order-api
    ports:
      - "5154:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # ServiceUrls / Inventory:GrpcUrl / AntiCorruption:GrpcEndpoints 由 appsettings.Docker.json 提供容器网络地址
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=order-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      # ACL gRPC 独立端口（manifest grpcPort=5254）：REST 走 8080/HTTP1，gRPC 走 5254/HTTP2
      - Kestrel__Endpoints__Rest__Url=http://+:8080
      - Kestrel__Endpoints__Rest__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5254
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
      - ConnectionStrings__OrderDb=${LENO_DB_ORDER}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
      - AntiCorruption__GrpcEndpoints__Product=http://product-api:5252
      - AntiCorruption__GrpcEndpoints__Promotion=http://promotion-api:5255
      - AntiCorruption__GrpcEndpoints__Points=http://points-api:5266
      - AntiCorruption__TargetInternalApiKeys__Product=${LENO_INTERNAL_API_KEY_SHARED}
      - AntiCorruption__TargetInternalApiKeys__Promotion=${LENO_INTERNAL_API_KEY_SHARED}
      - AntiCorruption__TargetInternalApiKeys__Points=${LENO_INTERNAL_API_KEY_SHARED}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  promotion-api:
    build:
      context: .
      dockerfile: src/Services/Promotion/Leno.Promotion.Api/Dockerfile
    container_name: leno-promotion-api
    ports:
      - "5155:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=promotion-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      # ACL gRPC 独立端口（manifest grpcPort=5255）：REST 走 8080/HTTP1，gRPC 走 5255/HTTP2
      - Kestrel__Endpoints__Rest__Url=http://+:8080
      - Kestrel__Endpoints__Rest__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5255
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
      - ConnectionStrings__PromotionDb=${LENO_DB_PROMOTION}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/Leno.Payment.Api/Dockerfile
    container_name: leno-payment-api
    ports:
      - "5156:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Consul__Url=http://consul:8500
      - Consul__ServiceAddress=payment-api
      - Consul__ServicePort=8080
      - InternalAuth__ApiKey=${INTERNAL_AUTH_API_KEY}
      - Security__InternalApiKey__Shared=${LENO_INTERNAL_API_KEY_SHARED}
      # ACL gRPC 独立端口（manifest grpcPort=5256）：REST 走 8080/HTTP1，gRPC 走 5256/HTTP2
      - Kestrel__Endpoints__Rest__Url=http://+:8080
      - Kestrel__Endpoints__Rest__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5256
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
      - Database__MigrateOnStartup=true
      - ConnectionStrings__PaymentDb=${LENO_DB_PAYMENT}
      - ConnectionStrings__SchedulerDb=${LENO_DB_SCHEDULER}
      - Redis__Configuration=${LENO_REDIS_CONFIGURATION}
      - RabbitMQ__Host=${LENO_RABBITMQ_HOST}
      - RabbitMQ__Port=${LENO_RABBITMQ_PORT}
      - RabbitMQ__Username=${LENO_RABBITMQ_USERNAME}
      - RabbitMQ__Password=${LENO_RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=${LENO_RABBITMQ_VIRTUALHOST}
      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
      # 支付渠道密钥仅 Payment BC 需要（ConfigCenterExtensions 按 Service:Name 收敛校验）
      - Payment__Alipay__AppId=${LENO_PAYMENT_ALIPAY_APPID}
      - Payment__Alipay__PrivateKey=${LENO_PAYMENT_ALIPAY_PRIVATEKEY}
      - Payment__Alipay__PublicKey=${LENO_PAYMENT_ALIPAY_PUBLICKEY}
      - Payment__WeChatPay__AppId=${LENO_PAYMENT_WECHATPAY_APPID}
      - Payment__WeChatPay__MchId=${LENO_PAYMENT_WECHATPAY_MCHID}
      - Payment__WeChatPay__ApiKey=${LENO_PAYMENT_WECHATPAY_APIKEY}
      - AntiCorruption__GrpcEndpoints__Order=http://order-api:5254
      - AntiCorruption__TargetInternalApiKeys__Order=${LENO_INTERNAL_API_KEY_SHARED}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  # 双轨下线 A1/A2（2026-09-23）：points-membership-api 与 review-aftersales-api 两个组合 BC 已退役，
  # 由 points-api / membership-api / review-api / aftersales-api 承接

  seller-shop-api:
