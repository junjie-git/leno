      - Elasticsearch__Uri=${LENO_ES_URI}
      - Jwt__DiscoveryUrl=http://identity-api:8080/.well-known/openid-configuration
      - Jwt__Issuer=leno-identity
      - Jwt__Audience=leno-clients
      # 本机 compose 的 Identity 以明文 HTTP 提供 JWKS/发现文档，
      # 需关闭 HTTPS 元数据强制（Production 仍由启动校验强制为 true）
      - Jwt__RequireHttpsMetadata=false
      # access-control 同时对外提供 REST（HTTP/1.1）与 gRPC（明文 HTTP/2，即 h2c）。
      # Kestrel 的 h2c 只在端点协议固定为 Http2 时可用；明文无 ALPN，Http1AndHttp2 会回落 HTTP/1.1，
      # Identity 的 Grpc.Net.Client 因此收到 HTTP_1_1_REQUIRED（实测 /api/auth/register 500）。
      # 故拆成两个端点：Default(8080, Http1) 供网关/浏览器 REST；Grpc(5263, Http2) 供 BC 间 gRPC。
      # 端口取自 deploy/services.manifest.json（access-control.grpcPort = 5263）。
      - Kestrel__Endpoints__Default__Url=http://+:8080
      - Kestrel__Endpoints__Default__Protocols=Http1
      - Kestrel__Endpoints__Grpc__Url=http://+:5263
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      # gRPC 服务端鉴权：GrpcInternalKeyInterceptor 校验 x-internal-key，缺失时 fail-closed 拒绝所有调用。
      - AntiCorruption__InternalApiKey=${LENO_INTERNAL_API_KEY_SHARED}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      consul:
        condition: service_healthy
      scheduler-db-init:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    restart: unless-stopped
    networks:
      - leno-net

  user-center-api:
    build:
      context: .
      dockerfile: src/Services/UserCenter/Leno.UserCenter.Api/Dockerfile
    container_name: leno-user-center-api
    ports:
      - "5164:8080"
    environment:
