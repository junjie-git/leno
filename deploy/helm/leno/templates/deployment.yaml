{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leno.serviceName" (dict "name" $name "context" $) }}
  labels:
    {{- include "leno.labels" (dict "name" $name "context" $) | nindent 4 }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      {{- include "leno.selectorLabels" (dict "name" $name "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "leno.selectorLabels" (dict "name" $name "context" $) | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "leno.image" (dict "service" $service "context" $) }}
          imagePullPolicy: {{ $service.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $service.httpPort | default $service.service.port }}
              protocol: TCP
            {{- if $service.grpcPort }}
            - name: grpc
              containerPort: {{ $service.grpcPort }}
              protocol: TCP
            {{- end }}
          env:
            {{/*
              一、引导配置（P0-B）：Consul KV 配置源自身的依赖，必须先于 KV 可用。
              注意：代码读取键为 Consul:Url（ConfigCenterExtensions / ConsulServiceRegistrationExtensions），
              旧模板注入的 Consul__Address 无任何读取点，已修正。
            */}}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $.Values.global.environment | default "Production" }}
            - name: Service__Name
              value: {{ $name | quote }}
            {{- if $service.grpcPort }}
            {{/*
              八、ACL gRPC 独立端口（与 docker-compose 对齐）：h2c 无 ALPN，gRPC 必须独占 HTTP/2 端口，
              REST 独占 HTTP/1 端口；Rest 绑定 httpPort 与 service.yaml/probe 端口保持一致。
            */}}
            - name: Kestrel__Endpoints__Rest__Url
              value: {{ printf "http://+:%v" ($service.httpPort | default $service.service.port) | quote }}
            - name: Kestrel__Endpoints__Rest__Protocols
              value: "Http1"
            - name: Kestrel__Endpoints__Grpc__Url
              value: {{ printf "http://+:%v" $service.grpcPort | quote }}
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: "Http2"
            {{- end }}
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ $.Values.global.jaeger.otlpEndpoint | quote }}
            - name: Consul__Url
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.consul.addressSecret }}
                  key: url
            {{/*
              Consul ACL token（可选）：ACL default deny 集群下业务读 KV/自注册需 token。
              代码读取键为 Consul:Token（ConfigCenterExtensions.cs / ConsulServiceRegistrationExtensions.cs /
              ApiGateway ServiceCollectionExtensions.cs 三处），K8s env 键 Consul__Token。
              tokenSecret.name 为空时不注入（dev 本地 compose 的 Consul dev 模式无 ACL）；
              staging/prod 由 values 启用（Secret 由 Runbook 步骤 4.2 创建，过渡态）。
            */}}
            {{- with $.Values.externalDependencies.consul.tokenSecret.name }}
            - name: Consul__Token
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.externalDependencies.consul.tokenSecret.key | default "acl-token" }}
            {{- end }}
            {{/*
              二、业务配置 env 兜底（P0-B）：生产主通道为 Consul KV（leno/config/**，经
              AddLenoConsulConfig 追加在配置链尾，KV 优先级高于 env）；此处 env 兜底保证
              KV 未种子化/不可达时服务仍可启动。键名与代码读取键严格一致（下划线双层级），
              敏感值来源 Secret（key 与代码读取键一致，见 deploy/docs/consul-kv-coverage-audit.md）。
            */}}
            {{- with $service.connectionStringKey }}
            - name: ConnectionStrings__{{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.sqlserver.connectionstringSecret }}
                  key: {{ . }}
            {{- end }}
            - name: Redis__Configuration
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.redis.connectionstringSecret }}
                  key: configuration
            - name: RabbitMQ__Host
              value: {{ $.Values.global.rabbitmq.host | quote }}
            - name: RabbitMQ__Port
              value: {{ $.Values.global.rabbitmq.port | quote }}
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.rabbitmq.connectionstringSecret }}
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.rabbitmq.connectionstringSecret }}
                  key: password
            - name: Elasticsearch__Uri
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.externalDependencies.elasticsearch.connectionstringSecret }}
                  key: uri
            {{/*
              三、鉴权引导（P0-B）：代码读取键为 InternalAuth:ApiKey（内部 HTTP 鉴权）与
              AntiCorruption:InternalApiKey（gRPC 服务端拦截器，fail-closed）。
              两者统一取 leno-security-jwt/internal-api-key；跨 BC gRPC 客户端所需的
              TargetInternalApiKeys 取同一 Secret 键，保证服务端/客户端密钥一致。
            */}}
            - name: InternalAuth__ApiKey
              valueFrom:
                secretKeyRef:
                  name: leno-security-jwt
                  key: internal-api-key
            - name: AntiCorruption__InternalApiKey
              valueFrom:
                secretKeyRef:
                  name: leno-security-jwt
                  key: internal-api-key
            {{- range $bcKey, $grpcTarget := $.Values.global.grpcEndpoints }}
            - name: AntiCorruption__GrpcEndpoints__{{ $bcKey }}
              value: {{ printf "http://%s-%s:%v" $.Release.Name $grpcTarget.service $grpcTarget.port | quote }}
            - name: AntiCorruption__TargetInternalApiKeys__{{ $bcKey }}
              valueFrom:
                secretKeyRef:
                  name: leno-security-jwt
                  key: internal-api-key
            {{- end }}
            {{/*
              四、服务间地址兜底（P0-B）：渲染为 K8s Service DNS；生产可用 Consul KV
              leno/config/ServiceUrls__* 覆盖。
            */}}
            {{- range $urlKey, $urlTarget := $.Values.global.serviceUrls }}
            - name: ServiceUrls__{{ $urlKey }}
              value: {{ printf "http://%s-%s:%v" $.Release.Name $urlTarget.service $urlTarget.port | quote }}
            {{- end }}
          readinessProbe:
            {{- toYaml $service.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $service.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
{{- end }}
{{- end }}
