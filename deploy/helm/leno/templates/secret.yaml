{{/*
敏感配置注入（P0-F）：
- externalSecrets.enabled=true（staging/prod 推荐方式）：chart 不渲染 Secret，
  由 External Secrets Operator 对接 Vault/Consul 创建 leno-security-jwt。
- externalSecrets.enabled=false（本地/开发）：必须通过 values 显式提供
  security.jwt.secretKey 与 security.internalAuth.apiKey，缺失时渲染直接失败
  ——绝不渲染 REPLACE_ME 之类的占位符（占位符曾导致服务以无效密钥启动）。
*/}}
{{- if not .Values.externalSecrets.enabled }}
{{- $jwtSecretKey := .Values.security.jwt.secretKey | default "" }}
{{- $internalApiKey := .Values.security.internalAuth.apiKey | default "" }}
{{- if eq $jwtSecretKey "" }}
{{- fail (printf "security.jwt.secretKey 未设置：externalSecrets.enabled=false 时必须显式提供 JWT 密钥（helm --set security.jwt.secretKey=... 或 values 文件）。chart 不再渲染占位符 Secret。生产环境请改用 externalSecrets.enabled=true 由 ESO 注入。") }}
{{- end }}
{{- if eq $internalApiKey "" }}
{{- fail (printf "security.internalAuth.apiKey 未设置：externalSecrets.enabled=false 时必须显式提供内部服务间鉴权密钥（env 键 InternalAuth__ApiKey，代码读取键 InternalAuth:ApiKey，至少 32 字节）。") }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: leno-security-jwt
  labels:
    {{- include "leno.labels" (dict "name" "security-jwt" "context" .) | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ $jwtSecretKey | quote }}
  internal-api-key: {{ $internalApiKey | quote }}
{{- end }}
