{{/*
敏感配置占位：生产通过 External Secrets Operator 从 Vault/Consul KV 注入实际值
本模板仅在 enabled=true 时创建空 Secret（开发/测试可直接 set 值），生产应改由 ExternalSecret 资源接管
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: leno-security-jwt
  labels:
    {{- include "leno.labels" (dict "name" "security-jwt" "context" .) | nindent 4 }}
type: Opaque
stringData:
  secret-key: "REPLACE_ME_VIA_EXTERNAL_SECRET"
{{- end }}
