# 预发环境：2 副本，启用 HPA，资源适中
global:
  environment: Staging

# 预发/生产：Secret 由 External Secrets Operator 对接 Vault/Consul 创建，
# chart 不渲染任何 Secret（secret.yaml 占位符已移除）
externalSecrets:
  enabled: true

services:
  api-gateway:
    replicaCount: 2
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70 }
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1000m, memory: 512Mi } }

  userauth:
    replicaCount: 2
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70 }
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1000m, memory: 512Mi } }
    migration: { enabled: true, runOnInit: true }

