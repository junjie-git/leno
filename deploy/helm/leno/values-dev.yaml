# 开发环境：单副本，无 HPA，资源限制低
global:
  environment: Development

services:
  api-gateway:
    replicaCount: 1
    hpa: { enabled: false }
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
    ingress: { enabled: false }

  userauth:
    replicaCount: 1
    hpa: { enabled: false }
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
