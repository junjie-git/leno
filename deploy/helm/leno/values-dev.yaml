# 开发环境：单副本，无 HPA，资源限制低
global:
  environment: Development

# dev-only 明文密钥：仅供本地开发集群，禁止用于 staging/prod
# （externalSecrets.enabled=false 时 secret.yaml 必需）
security:
  jwt:
    secretKey: "dev-only-jwt-secret-key-0123456789abcdef0123456789abcdef"
  internalAuth:
    apiKey: "dev-only-internal-api-key-0123456789abcdef"

services:
  api-gateway:
    replicaCount: 1
    hpa: { enabled: false }
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
    ingress: { enabled: false }

  userauth:
    replicaCount: 1
    hpa: { enabled: false }
    resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
    migration: { enabled: true, runOnInit: true }

