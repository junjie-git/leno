# 全局配置
global:
  # 镜像参数化（阶段 3）：
  # - imageRegistry：镜像仓库地址（默认空 = 本地镜像名；K8s 部署时 CD 会 --set 为 ghcr.io）
  # - imageNamespace：镜像命名空间（GHCR 为 owner 名；与 repository 组合为 <registry>/<namespace>/<repository>）
  # - imageTag：全局默认镜像 tag；服务级 services.<name>.image.tag 优先；
  #   CD（.github/workflows/cd.yml）通过 --set global.imageTag=<tag> 注入
  imageRegistry: ""
  imageNamespace: ""
  imageTag: "1.0.0"
  imagePullSecrets: []
  storageClass: ""
  environment: Production
  nameOverride: ""
  consul:
    address: "http://consul:8500"
  rabbitmq:
    host: "rabbitmq"
    port: 5672
  # 服务间地址兜底（生产主通道为 Consul KV leno/config/ServiceUrls__*，此处为 env 兜底）
  # 值在 deployment.yaml 中渲染为 http://{release}-{service}:{port}（K8s Service DNS）
  serviceUrls:
    ProductApi: { service: "product", port: 5152 }
    IdentityApi: { service: "identity", port: 5162 }
    PromotionApi: { service: "promotion", port: 5155 }
    PointsApi: { service: "points", port: 5166 }
    OrderApi: { service: "order", port: 5154 }
    PaymentApi: { service: "payment", port: 5156 }
  redis:
    host: "redis"
    port: 6379
  elasticsearch:
    host: "elasticsearch"
    port: 9200
  sqlserver:
    host: "sqlserver"
    port: 1433
    database: "leno"
  jaeger:
    otlpEndpoint: "http://jaeger:4317"

# 15 个服务（14 个 BC + 1 个 API 网关）
# 2026-09-21 由 12 个扩至 15 个：补入 identity / accesscontrol / usercenter（A-1 拆分目标）
services:
  # ===== API 网关 =====
  api-gateway:
    enabled: true
    image:
      repository: leno-api-gateway
      pullPolicy: IfNotPresent
    replicaCount: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    service:
      type: ClusterIP
      port: 8080
    httpPort: 8080
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: api.leno.example.com
          paths:
            - path: /
              pathType: Prefix
    migration:
      enabled: false
      runOnInit: false
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30

    product:
    # 数据库连接串在 leno-db-connectionstrings Secret 中的 key（与代码 GetConnectionString("ProductDb") 严格一致）
    connectionStringKey: ProductDb
    enabled: true
    image: { repository: leno-product, pullPolicy: IfNotPresent }
    replicaCount: 2
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1000m, memory: 512Mi } }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
    service: { type: ClusterIP, port: 5152 }
    httpPort: 5152
    grpcPort: 5252
    migration: { enabled: true, runOnInit: true }
    ingress: { enabled: false }
    readinessProbe: { httpGet: { path: /health/ready, port: 5152 }, initialDelaySeconds: 15, periodSeconds: 10 }
