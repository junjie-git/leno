# 全局配置
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  environment: Production
  nameOverride: ""
  consul:
    address: "http://consul:8500"
  rabbitmq:
    host: "rabbitmq"
    port: 5672
  redis:
    host: "redis"
    port: 6379
  elasticsearch:
    host: "elasticsearch"
    port: 9200
  sqlserver:
    host: "sqlserver"
    port: 1433
    database: "leno"
  jaeger:
    otlpEndpoint: "http://jaeger:4317"

# 12 个服务（11 个 BC + 1 个 API 网关）
services:
  # ===== API 网关 =====
  api-gateway:
    enabled: true
    image:
      repository: leno/api-gateway
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    replicaCount: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    service:
      type: ClusterIP
      port: 8080
    httpPort: 8080
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: api.leno.example.com
          paths:
            - path: /
              pathType: Prefix
    migration:
      enabled: false
      runOnInit: false
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /health/live
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30

  # ===== userauth BC =====
  userauth:
    enabled: true
    image: { repository: leno/userauth-api, tag: "1.0.0", pullPolicy: IfNotPresent }
    replicaCount: 2
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1000m, memory: 512Mi } }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70 }
    service: { type: ClusterIP, port: 5151 }
    httpPort: 5151
    grpcPort: 5251
    migration: { enabled: true, runOnInit: true }
    ingress: { enabled: false }
    readinessProbe: { httpGet: { path: /health/ready, port: 5151 }, initialDelaySeconds: 15, periodSeconds: 10 }
    livenessProbe: { httpGet: { path: /health/live, port: 5151 }, initialDelaySeconds: 30, periodSeconds: 30 }

  # ===== product BC =====
  product:
    enabled: true
    image: { repository: leno/product-api, tag: "1.0.0", pullPolicy: IfNotPresent }
