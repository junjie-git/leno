# 数据库迁移（P0-E）：执行 files/migrations/ 下的幂等 SQL（sqlcmd）
# SQL 由 scripts/generate-migration-scripts.ps1 产出并同步到 chart files 目录（CI 中保持同步）
migrations:
  enabled: true
  sqlcmdImage: "mcr.microsoft.com/mssql-tools18:latest"
  scriptsDir: "files/migrations"
  # Quartz.NET 调度库（独立 LenoScheduler，DEC-2 决策 (b) 2026-09-21）
  # QRTZ_* 表由 Quartz 自有 DDL 管理，不纳入 EF 迁移（见 scheduler-quartz.sql 头部说明与
  # docs/双轨下线-实施方案.md §5.5）。因"调度器"不是业务服务，migration-job 的
  # {service}-*.sql 匹配不覆盖它，故由独立的 scheduler-migration-job 执行 scheduler-*.sql。
  scheduler:
    enabled: true
    connectionStringKey: SchedulerDb

# 外部依赖（SQL Server/Redis/RabbitMQ/ES/Consul/Jaeger/Prometheus/Grafana/Alertmanager）
# 本 chart 不部署基础设施，假设已存在或通过 Bitnami/Prometheus Community chart 部署
externalDependencies:
  sqlserver:
    enabled: true
    connectionstringSecret: "leno-db-connectionstrings"
  rabbitmq:
    enabled: true
    connectionstringSecret: "leno-mq-rabbitmq"
  redis:
    enabled: true
    connectionstringSecret: "leno-redis-connection"
  elasticsearch:
    enabled: true
    connectionstringSecret: "leno-es-connection"
  consul:
    enabled: true
    addressSecret: "leno-consul-address"
    # Consul ACL token（可选，deployment.yaml 按 name 非空注入 Consul__Token env）。
    # name 留空 = 不注入（dev 本地 compose 的 Consul dev 模式无 ACL）；
    # staging/prod 约定 name: leno-consul-token（key: acl-token），Secret 由
    # deploy/staging/README.md 步骤 4.2 创建（过渡态）；目标态由 ESO+Vault 接管。
    tokenSecret:
      name: ""
      key: "acl-token"

# 敏感配置通过 K8s Secret 引用（External Secrets Operator 对接 Vault/Consul）
externalSecrets:
  enabled: false
  backend: consul  # 或 vault
  refreshInterval: 1h

# JWT / 内部鉴权密钥（P0-F）：仅在 externalSecrets.enabled=false 时使用，
# 缺失时 secret.yaml 渲染直接失败（不再渲染占位符）。
# 生产/Staging 建议开启 externalSecrets 由 ESO 注入。
security:
  jwt:
    secretKey: ""        # 至少 32 字节随机串（HS256 要求 256 位）
  internalAuth:
    apiKey: ""           # 内部服务间鉴权密钥（代码读取键 InternalAuth:ApiKey），至少 32 字节

# Prometheus 抓取配置（service monitor 占位，实际通过 Prometheus Community chart 注入）
prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
