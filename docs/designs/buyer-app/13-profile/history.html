<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览历史 - Leno 电商平台</title>
  <style>
    :root {
      --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
      --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
      --r-base:6px; --r-card:8px; --r-lg:12px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
      --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
      --fw-normal:400; --fw-medium:500; --fw-semibold:600;
      --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
      --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: var(--ff-app);
      background: var(--n3);
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 24px rgba(0,0,0,.08);
      color: var(--n10);
      font-size: var(--fs-base);
      line-height: 1.5715;
      padding-bottom: 56px;
    }

    /* ===== NavBar ===== */
    .navbar {
      height: 46px;
      background: var(--n1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--s3);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--n3);
    }
    .navbar-left, .navbar-right {
      width: 40px;
      display: flex;
      align-items: center;
    }
    .navbar-right { justify-content: flex-end; }
    .navbar-left a, .navbar-right a {
      display: flex;
      align-items: center;
      color: var(--n10);
      font-size: var(--fs-sm);
    }
    .navbar-left svg, .navbar-right svg { width: 20px; height: 20px; fill: var(--n10); }
    .navbar-title {
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      color: var(--n10);
    }
    .manage-btn { color: var(--n9); }

    /* ===== 日期分组 ===== */
    .history-content { padding: var(--s3); }
    .date-group {
      margin-bottom: var(--s3);
    }
    .date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--s2) var(--s1);
      margin-bottom: var(--s2);
    }
    .date-label {
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
      color: var(--c-primary);
      display: flex;
      align-items: center;
      gap: var(--s1);
    }
    .date-label svg { width: 14px; height: 14px; fill: var(--c-primary); }
    .date-count {
      font-size: var(--fs-sm);
      color: var(--n7);
    }

    /* ===== 历史商品卡片 ===== */
    .history-card {
      background: var(--n1);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-card);
      padding: var(--s3);
      margin-bottom: var(--s2);
      display: flex;
      gap: var(--s3);
      position: relative;
    }
    .history-img {
      width: 80px;
      height: 80px;
      border-radius: var(--r-card);
      background: var(--n2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .history-img svg { width: 50%; height: 50%; }
    .history-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .history-name {
      font-size: var(--fs-base);
      color: var(--n10);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .history-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
    }
    .history-price {
      font-size: var(--fs-lg);
      font-weight: var(--fw-semibold);
      color: var(--c-error);
    }
    .history-price small {
      font-size: var(--fs-sm);
      font-weight: var(--fw-normal);
    }
    .history-time {
      font-size: var(--fs-sm);
      color: var(--n7);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .history-time svg { width: 10px; height: 10px; fill: var(--n7); }
    .history-shop {
      font-size: var(--fs-sm);
      color: var(--n7);
      margin-top: var(--s1);
    }
    .cart-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      padding: var(--s1) var(--s3);
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: var(--r-base);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
    }
    .cart-btn svg { width: 14px; height: 14px; fill: #fff; }

    /* ===== 底部操作栏 ===== */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      max-width: 100%;
      background: var(--n1);
      padding: var(--s3);
      border-top: 1px solid var(--n3);
      z-index: 100;
      padding-bottom: calc(var(--s3) + env(safe-area-inset-bottom));
    }
    .clear-btn {
      width: 100%;
      height: 44px;
      background: var(--n1);
      color: var(--c-error);
      border: 1px solid var(--c-error);
      border-radius: var(--r-lg);
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s1);
    }
    .clear-btn svg { width: 18px; height: 18px; fill: var(--c-error); }

    /* ===== 骨架屏 ===== */
    .skeleton-block {
      background: linear-gradient(90deg, var(--n3) 25%, var(--n2) 37%, var(--n3) 63%);
      background-size: 400% 100%;
      animation: skeleton-loading 1.4s ease infinite;
      border-radius: var(--r-base);
    }
    @keyframes skeleton-loading {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    .sk-card {
      background: var(--n1);
      border-radius: var(--r-lg);
      padding: var(--s3);
      margin-bottom: var(--s2);
      display: flex;
      gap: var(--s3);
    }

    /* ===== 空状态 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s12) var(--s4);
      text-align: center;
    }
    .empty-state svg { width: 80px; height: 80px; fill: var(--n5); margin-bottom: var(--s3); }
    .empty-text { font-size: var(--fs-base); color: var(--n7); margin-bottom: var(--s4); }
    .empty-btn {
      padding: var(--s2) var(--s6);
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: var(--r-base);
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
    }

    /* ===== 错误状态 ===== */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s12) var(--s4);
      text-align: center;
    }
    .error-state svg { width: 64px; height: 64px; fill: var(--n5); margin-bottom: var(--s3); }
    .error-text { font-size: var(--fs-base); color: var(--n7); margin-bottom: var(--s4); }
    .retry-btn {
      padding: var(--s2) var(--s6);
      background: var(--n1);
      color: var(--c-primary);
      border: 1px solid var(--c-primary);
      border-radius: var(--r-base);
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
    }

    /* ===== 状态切换器 ===== */
    .state-toggle {
      position: fixed;
      top: var(--s2);
      right: var(--s2);
      z-index: 200;
      display: flex;
      gap: var(--s1);
    }
    .state-toggle button {
      padding: var(--s1) var(--s2);
      border: 1px solid var(--n5);
      border-radius: var(--r-base);
      background: var(--n1);
      font-size: var(--fs-sm);
      color: var(--n9);
      cursor: pointer;
    }
    .state-toggle button.active {
      background: var(--c-primary);
      color: #fff;
      border-color: var(--c-primary);
    }

    .hidden { display: none !important; }

    /* 已下架样式 */
    .history-card.offshore { opacity: .6; }
    .offshore-tag {
      display: inline-block;
      padding: 1px var(--s2);
      background: var(--n7);
      color: #fff;
      font-size: 10px;
      border-radius: var(--r-base);
      margin-left: var(--s1);
    }
    .cart-btn.disabled {
      background: var(--n5);
      color: var(--n7);
    }
    .cart-btn.disabled svg { fill: var(--n7); }
  </style>
</head>

                  <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1z"/></svg>
                  加入购物车
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 骨架屏状态 -->
  <div id="page-skeleton" class="hidden">
    <div class="history-content">
      <div class="date-group">
        <div class="date-header">
          <div class="skeleton-block" style="width:50px;height:14px;"></div>
          <div class="skeleton-block" style="width:40px;height:12px;"></div>
        </div>
        <div class="sk-card">
          <div class="skeleton-block" style="width:80px;height:80px;border-radius:8px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;">
            <div class="skeleton-block" style="width:90%;height:14px;margin-bottom:4px;"></div>
            <div class="skeleton-block" style="width:60%;height:12px;"></div>
            <div style="display:flex;justify-content:space-between;">
              <div class="skeleton-block" style="width:50px;height:16px;"></div>
              <div class="skeleton-block" style="width:80px;height:24px;border-radius:6px;"></div>
            </div>
          </div>
        </div>
        <div class="sk-card">
          <div class="skeleton-block" style="width:80px;height:80px;border-radius:8px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;">
            <div class="skeleton-block" style="width:90%;height:14px;margin-bottom:4px;"></div>
            <div class="skeleton-block" style="width:60%;height:12px;"></div>
            <div style="display:flex;justify-content:space-between;">
              <div class="skeleton-block" style="width:50px;height:16px;"></div>
              <div class="skeleton-block" style="width:80px;height:24px;border-radius:6px;"></div>
            </div>
          </div>
        </div>
        <div class="sk-card">
          <div class="skeleton-block" style="width:80px;height:80px;border-radius:8px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;">
            <div class="skeleton-block" style="width:90%;height:14px;margin-bottom:4px;"></div>
            <div class="skeleton-block" style="width:60%;height:12px;"></div>
            <div style="display:flex;justify-content:space-between;">
              <div class="skeleton-block" style="width:50px;height:16px;"></div>
              <div class="skeleton-block" style="width:80px;height:24px;border-radius:6px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 空数据状态 -->
  <div id="page-empty" class="hidden">
    <div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      <div class="empty-text">暂无浏览记录</div>
      <button class="empty-btn">去逛逛</button>
    </div>
  </div>

  <!-- 错误状态 -->
  <div id="page-error" class="hidden">
    <div class="error-state">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <div class="error-text">网络异常，加载失败</div>
      <button class="retry-btn">重试</button>
    </div>
  </div>

  <!-- 底部清空栏 -->
  <div class="bottom-bar" id="bottom-bar">
    <button class="clear-btn">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      清空全部历史
    </button>
  </div>

  <script>
    function showState(state) {
      var states = ['normal', 'skeleton', 'empty', 'error'];
      states.forEach(function(s) {
        var el = document.getElementById('page-' + s);
        if (el) { el.classList.add('hidden'); }
      });
      document.getElementById('page-' + state).classList.remove('hidden');
      document.querySelectorAll('.state-toggle button').forEach(function(btn){ btn.classList.remove('active'); });
      event.target.classList.add('active');
      var bottomBar = document.getElementById('bottom-bar');
      if (state === 'empty' || state === 'error') {
        bottomBar.style.display = 'none';
      } else {
        bottomBar.style.display = 'block';
      }
    }
  </script>
</body>
