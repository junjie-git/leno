<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - Leno 电商平台</title>
  <style>
    :root {
      --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
      --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
      --r-base:6px; --r-card:8px; --r-lg:12px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
      --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
      --fw-normal:400; --fw-medium:500; --fw-semibold:600;
      --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
      --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: var(--ff-app);
      background: var(--n3);
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 24px rgba(0,0,0,.08);
      color: var(--n10);
      font-size: var(--fs-base);
      line-height: 1.5715;
      padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }

    /* ===== NavBar ===== */
    .navbar {
      height: 46px;
      background: var(--n1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--s3);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--n3);
    }
    .navbar-left, .navbar-right {
      width: 40px;
      display: flex;
      align-items: center;
    }
    .navbar-right { justify-content: flex-end; }
    .navbar-left a {
      display: flex;
      align-items: center;
      color: var(--n10);
    }
    .navbar-left svg { width: 20px; height: 20px; fill: var(--n10); }
    .navbar-title {
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      color: var(--n10);
    }

    /* ===== 设置分组 ===== */
    .settings-content { padding: var(--s3); }
    .settings-group {
      margin-bottom: var(--s3);
    }
    .group-title {
      font-size: var(--fs-sm);
      color: var(--n7);
      font-weight: var(--fw-medium);
      padding: 0 var(--s1) var(--s2);
    }
    .group-card {
      background: var(--n1);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-card);
      overflow: hidden;
    }

    /* ===== 设置项 ===== */
    .setting-item {
      display: flex;
      align-items: center;
      padding: 0 var(--s4);
      min-height: 48px;
      gap: var(--s3);
      border-bottom: 1px solid var(--n3);
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--r-base);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .setting-icon svg { width: 16px; height: 16px; }
    .setting-label {
      flex: 1;
      font-size: var(--fs-base);
      color: var(--n10);
    }
    .setting-value {
      font-size: var(--fs-base);
      color: var(--n7);
    }
    .setting-arrow svg { width: 16px; height: 16px; fill: var(--n7); }

    /* ===== 开关 ===== */
    .switch {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--c-primary);
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .switch.off { background: var(--n5); }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 22px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .switch.off::after { left: 2px; }

    /* ===== 退出登录按钮 ===== */
    .logout-section {
      margin-top: var(--s6);
      padding: 0 var(--s3);
    }
    .logout-btn {
      width: 100%;
      height: 50px;
      background: var(--n1);
      border: none;
      border-radius: var(--r-lg);
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      color: var(--c-error);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s1);
      box-shadow: var(--sh-card);
    }
    .logout-btn svg { width: 18px; height: 18px; fill: var(--c-error); }

    /* ===== 骨架屏 ===== */
    .skeleton-block {
      background: linear-gradient(90deg, var(--n3) 25%, var(--n2) 37%, var(--n3) 63%);
      background-size: 400% 100%;
      animation: skeleton-loading 1.4s ease infinite;
      border-radius: var(--r-base);
    }
    @keyframes skeleton-loading {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    /* ===== 错误状态 ===== */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s12) var(--s4);
      text-align: center;
    }
    .error-state svg { width: 64px; height: 64px; fill: var(--n5); margin-bottom: var(--s3); }
    .error-text { font-size: var(--fs-base); color: var(--n7); margin-bottom: var(--s4); }
    .retry-btn {
      padding: var(--s2) var(--s6);
      background: var(--n1);
      color: var(--c-primary);
      border: 1px solid var(--c-primary);
      border-radius: var(--r-base);
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
    }

    /* ===== 状态切换器 ===== */
    .state-toggle {
      position: fixed;
      top: var(--s2);
      right: var(--s2);
      z-index: 200;
      display: flex;
      gap: var(--s1);
    }
    .state-toggle button {
      padding: var(--s1) var(--s2);
      border: 1px solid var(--n5);
      border-radius: var(--r-base);
      background: var(--n1);
      font-size: var(--fs-sm);
      color: var(--n9);
      cursor: pointer;
    }
    .state-toggle button.active {
      background: var(--c-primary);
      color: #fff;
      border-color: var(--c-primary);
    }

    .hidden { display: none !important; }

    /* 版本号底部信息 */
    .version-info {
      text-align: center;
      padding: var(--s4);
      font-size: var(--fs-sm);
      color: var(--n7);
      line-height: 1.6;
    }
    .version-info span { display: block; }
  </style>
</head>
<body>
  <div class="state-toggle">
    <button class="active" onclick="showState('normal')">正常</button>
    <button onclick="showState('skeleton')">骨架屏</button>
    <button onclick="showState('error')">错误</button>
  </div>

  <!-- NavBar -->

    <div class="navbar-left">

      </a>

    <span class="navbar-title">设置</span>
    <div class="navbar-right"></div>

    <div class="settings-content">

  <script>
    function showState(state) {
      var states = ['normal', 'skeleton', 'error'];
      states.forEach(function(s) {
        var el = document.getElementById('page-' + s);
        if (el) { el.classList.add('hidden'); }
      });
      document.getElementById('page-' + state).classList.remove('hidden');
      document.querySelectorAll('.state-toggle button').forEach(function(btn){ btn.classList.remove('active'); });
      event.target.classList.add('active');
    }

    function toggleSwitch(el) {
      if (el.classList.contains('off')) {
        el.classList.remove('off');
        el.setAttribute('aria-checked', 'true');
      } else {
        el.classList.add('off');
        el.setAttribute('aria-checked', 'false');
      }
    }
