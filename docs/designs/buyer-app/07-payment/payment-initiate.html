<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收银台 - Leno</title>
  <style>
    :root {
      --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
      --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
      --r-base:6px; --r-card:8px; --r-lg:12px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
      --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
      --fw-normal:400; --fw-medium:500; --fw-semibold:600;
      --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
      --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      font-family: var(--ff-app);
      font-size: var(--fs-base);
      color: var(--n10);
      background: #F0F2F5;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5715;
    }

    body {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--n2);
      box-shadow: 0 0 24px rgba(0,0,0,.08);
      position: relative;
    }

    /* NavBar 46px */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      height: 46px;
      background: var(--n1);
      border-bottom: 1px solid var(--n3);
      padding: 0 var(--s3);
    }
    .nav-bar__back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: var(--n10);
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-bar__title {
      flex: 1;
      text-align: center;
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      color: var(--n10);
      margin-right: 32px;
    }

    /* Content */
    .content {
      padding: var(--s3);
      padding-bottom: 80px;
    }

    /* 金额卡片 */
    .amount-card {
      background: linear-gradient(135deg, #1677FF 0%, #0E5FCC 100%);
      border-radius: var(--r-lg);
      padding: var(--s6) var(--s4);
      color: #fff;
      text-align: center;
      margin-bottom: var(--s3);
      position: relative;
      overflow: hidden;
    }
    .amount-card::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }
    .amount-card__label {
      font-size: var(--fs-sm);
      opacity: .85;
      margin-bottom: var(--s2);
    }
    .amount-card__value {
      font-size: var(--fs-3xl);
      font-weight: var(--fw-semibold);
      line-height: 1.2;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
    }
    .amount-card__value .symbol {
      font-size: var(--fs-xl);
      font-weight: var(--fw-medium);
    }
    .amount-card__meta {
      display: flex;
      justify-content: center;
      gap: var(--s4);
      margin-top: var(--s3);
      font-size: var(--fs-sm);
      opacity: .9;
      position: relative;
      z-index: 1;
    }
    .amount-card__meta .divider {
      color: rgba(255,255,255,.4);
    }

    /* 倒计时 */
    .countdown {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .countdown .time {
      font-variant-numeric: tabular-nums;
      font-weight: var(--fw-semibold);
      color: #FFE08A;
    }

    /* 区块标题 */
    .section-title {
      display: flex;
      align-items: center;
      gap: var(--s2);
      font-size: var(--fs-base);
      font-weight: var(--fw-medium);
      color: var(--n9);
      margin: var(--s4) 0 var(--s2);
      padding-left: var(--s1);
    }

    /* 支付方式列表 */
    .pay-methods {
      background: var(--n1);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--sh-card);
    }
    .pay-item {
      display: flex;
      align-items: center;
      padding: var(--s3) var(--s4);
      cursor: pointer;
      border-bottom: 1px solid var(--n3);
      transition: background 100ms cubic-bezier(0.2,0,0,1);
    }
    .pay-item:last-child { border-bottom: none; }
    .pay-item:active { background: var(--n2); }
    .pay-item__icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: var(--s3);
      flex-shrink: 0;
    }
    .pay-item__body {
      flex: 1;
      min-width: 0;
    }
    .pay-item__name {
      font-size: var(--fs-lg);
      font-weight: var(--fw-medium);
      color: var(--n10);
      display: flex;
      align-items: center;
      gap: var(--s2);
    }
    .pay-item__tag {
      font-size: 11px;
      color: var(--c-warning);
      background: rgba(250,173,20,.12);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: var(--fw-medium);
    }
    .pay-item__desc {
      font-size: var(--fs-sm);
      color: var(--n7);
      margin-top: 2px;
    }
    .pay-item__radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--n5);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 100ms cubic-bezier(0.2,0,0,1);
    }
    .pay-item.active .pay-item__radio {
      border-color: var(--c-primary);
      background: var(--c-primary);
    }
    .pay-item.active .pay-item__radio svg {
      opacity: 1;
    }
    .pay-item__radio svg {
      opacity: 0;
      transition: opacity 100ms;
    }

    /* 安全提示 */
    .notice-bar {
      display: flex;
      align-items: center;
      gap: var(--s2);
      background: rgba(82,196,26,.08);
      border-radius: var(--r-base);
      padding: var(--s2) var(--s3);
      margin-top: var(--s3);
      font-size: var(--fs-sm);
      color: var(--c-success);
    }

    /* 底部支付栏 */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      background: var(--n1);
      border-top: 1px solid var(--n3);
      padding: var(--s2) var(--s3);
      padding-bottom: calc(var(--s2) + env(safe-area-inset-bottom, 0px));
      z-index: 50;
    }
    .pay-btn {
      width: 100%;
      height: 44px;
      background: var(--c-primary);
      color: #fff;
      border: none;
      border-radius: 22px;
      font-size: var(--fs-lg);
      font-weight: var(--fw-semibold);
      font-family: var(--ff-app);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: opacity 100ms;
    }
    .pay-btn:active { opacity: .85; }
    .pay-btn .amount {
      font-variant-numeric: tabular-nums;
    }
    .pay-btn[disabled] {
      background: #9BC4FF;
      cursor: not-allowed;
    }

    /* Loading 遮罩 */
    .loading-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .loading-mask.show { display: flex; }
    .loading-box {
      background: var(--n1);
      border-radius: var(--r-lg);
      padding: var(--s6) var(--s8);
      text-align: center;
      min-width: 140px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--n3);
      border-top-color: var(--c-primary);
      border-radius: 50%;
      margin: 0 auto var(--s3);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: var(--fs-base);
      color: var(--n10);
      font-weight: var(--fw-medium);
    }
    .loading-sub {
      font-size: var(--fs-sm);
      color: var(--n7);
      margin-top: var(--s1);
    }
  </style>
</head>
<body>
  <!-- NavBar -->
  <header class="nav-bar">
    <button class="nav-bar__back" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M12.5 4L7 10l5.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="nav-bar__title">收银台</h1>
  </header>

  <!-- Content -->
  <main class="content">
    <!-- 金额卡片 -->
    <section class="amount-card">
      <div class="amount-card__label">应付金额</div>
      <div class="amount-card__value">
        <span class="symbol">¥</span><span>299.00</span>
      </div>
      <div class="amount-card__meta">
        <span>订单编号 NO202607261523001</span>
        <span class="divider">|</span>
        <span class="countdown">剩余支付时间 <span class="time" id="countdown">14:59</span></span>
      </div>
    </section>

    <!-- 支付方式 -->
    <h2 class="section-title">选择支付方式</h2>
    <div class="pay-methods" id="payMethods">
      <!-- 微信支付 -->
      <div class="pay-item active" data-channel="wechat" role="radio" aria-checked="true">
        <div class="pay-item__icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#07C160"/>
            <path d="M11.2 8.4c-3.2 0-5.8 2.1-5.8 4.7 0 1.5.9 2.8 2.2 3.7l-.5 1.6 1.9-1c.7.2 1.4.3 2.2.3.2 0 .4 0 .6 0-.1-.4-.2-.9-.2-1.3 0-2.4 2.3-4.4 5.2-4.4.2 0 .4 0 .6 0-.5-2-2.9-3.6-6.2-3.6Zm-2 1.9c.4 0 .7.3.7.7s-.3.7-.7.7-.7-.3-.7-.7.3-.7.7-.7Zm4.1 0c.4 0 .7.3.7.7s-.3.7-.7.7-.7-.3-.7-.7.3-.7.7-.7Z" fill="#fff"/>
            <path d="M23 14.8c0-2.1-2.1-3.9-4.7-3.9s-4.7 1.7-4.7 3.9 2.1 3.9 4.7 3.9c.6 0 1.1-.1 1.6-.2l1.5.8-.4-1.3c1.2-.8 2-2 2-3.2Zm-6.3-.8c-.3 0-.6-.2-.6-.6 0-.3.2-.6.6-.6.3 0 .6.2.6.6 0 .3-.3.6-.6.6Zm3.3 0c-.3 0-.6-.2-.6-.6 0-.3.2-.6.6-.6.3 0 .6.2.6.6 0 .3-.3.6-.6.6Z" fill="#fff"/>
          </svg>
        </div>
        <div class="pay-item__body">
          <div class="pay-item__name">微信支付</div>
          <div class="pay-item__desc">微信内可用，推荐使用</div>
        </div>
        <div class="pay-item__radio">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- 支付宝 -->
      <div class="pay-item" data-channel="alipay" role="radio" aria-checked="false">
        <div class="pay-item__icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#1677FF"/>
            <path d="M20 17.5c-.8.4-1.7.6-2.6.8-.9.1-1.8.2-2.8.2-1.5 0-2.9-.2-4.1-.7-1.2-.4-2.1-1.1-2.8-2-.6-.9-1-2-1-3.3 0-1.2.3-2.3 1-3.2.6-.9 1.6-1.6 2.7-2.1 1.2-.5 2.5-.7 4-.7 1.2 0 2.3.2 3.2.5 1 .4 1.7.9 2.3 1.6.5.7.8 1.5.8 2.5 0 .7-.1 1.3-.4 1.9-.3.5-.6 1-1 1.3-.4.3-.9.5-1.3.5-.4 0-.7-.1-.9-.4-.2-.2-.3-.6-.2-1l.4-2.6c0-.5 0-.9-.2-1.2-.2-.3-.5-.4-1-.4-.5 0-.9.2-1.2.5-.3.4-.5.8-.6 1.4h2.3l-.2 1.2h-2.2l-.2 1.4h2.2l-.3 1.6c-.1.6 0 1 .3 1.3.2.3.6.4 1 .4.5 0 1-.2 1.4-.5.4-.3.8-.8 1-1.4.3-.6.4-1.3.4-2.1 0-.9-.2-1.7-.7-2.4-.5-.7-1.1-1.2-2-1.6-.9-.4-1.9-.6-3.1-.6-1.3 0-2.4.2-3.4.7-1 .4-1.7 1.1-2.3 1.9-.5.8-.8 1.7-.8 2.7 0 1 .3 1.9.8 2.7.5.8 1.3 1.4 2.3 1.8 1 .4 2.1.6 3.4.6.9 0 1.7-.1 2.5-.3.8-.2 1.5-.4 2.2-.8l.6 1.2Z" fill="#fff"/>
          </svg>
        </div>
        <div class="pay-item__body">
          <div class="pay-item__name">支付宝 <span class="pay-item__tag">立减优惠</span></div>
          <div class="pay-item__desc">跳转支付宝完成支付</div>
        </div>
        <div class="pay-item__radio">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- 余额支付 -->
      <div class="pay-item" data-channel="balance" role="radio" aria-checked="false">
        <div class="pay-item__icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#FAAD14"/>
            <path d="M14 6.5c-3.6 0-6.5 2.6-6.5 5.8 0 1.6.7 3.1 1.9 4.2-.1.9-.5 2-1.3 2.8-.2.2-.1.6.2.6 1.8-.1 3.2-.7 4.2-1.4.5.1 1 .2 1.5.2 3.6 0 6.5-2.6 6.5-5.8S17.6 6.5 14 6.5Z" fill="#fff"/>
            <text x="14" y="16.5" text-anchor="middle" font-size="6.5" fill="#FAAD14" font-weight="700">¥</text>
          </svg>
        </div>
        <div class="pay-item__body">
          <div class="pay-item__name">账户余额</div>
          <div class="pay-item__desc">可用余额 ¥50.00</div>
        </div>
        <div class="pay-item__radio">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- 银行卡 -->
      <div class="pay-item" data-channel="bankcard" role="radio" aria-checked="false">
        <div class="pay-item__icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="7" fill="#595959"/>
            <rect x="6" y="8" width="16" height="12" rx="1.5" fill="#fff"/>
            <rect x="6" y="10.5" width="16" height="2" fill="#595959"/>
            <rect x="9" y="15.5" width="5" height="1.5" rx="0.5" fill="#595959"/>
          </svg>
        </div>
        <div class="pay-item__body">
          <div class="pay-item__name">银行卡支付</div>
          <div class="pay-item__desc">支持储蓄卡 / 信用卡</div>
        </div>
        <div class="pay-item__radio">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 安全提示 -->
    <div class="notice-bar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1.5L2.5 3.5V7c0 2.9 2 5.3 4.5 6 2.5-.7 4.5-3.1 4.5-6V3.5L7 1.5Z" stroke="#52C41A" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M5 7L6.5 8.5L9 5.5" stroke="#52C41A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>支付环境加密保护，请放心支付</span>
    </div>
  </main>

  <!-- 底部支付栏 -->
  <footer class="action-bar">
    <button class="pay-btn" id="payBtn" aria-label="确认支付">
      确认支付 <span class="amount">¥299.00</span>
    </button>
  </footer>

  <!-- Loading 遮罩 -->
  <div class="loading-mask" id="loadingMask" role="alert" aria-live="assertive">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-text">支付中</div>
      <div class="loading-sub">请稍候，正在处理</div>
    </div>
  </div>

  <script>
    // 支付方式单选切换
    (function () {
      var items = document.querySelectorAll('.pay-item');
      items.forEach(function (item) {
        item.addEventListener('click', function () {
          items.forEach(function (i) {
            i.classList.remove('active');
            i.setAttribute('aria-checked', 'false');
          });
          item.classList.add('active');
          item.setAttribute('aria-checked', 'true');
        });
      });

      // 倒计时
      var total = 14 * 60 + 59; // 14:59
      var el = document.getElementById('countdown');
      function tick() {
        if (total < 0) {
          el.textContent = '00:00';
          el.style.color = '#FF4D4F';
          return;
        }
        var m = Math.floor(total / 60).toString().padStart(2, '0');
        var s = (total % 60).toString().padStart(2, '0');
        el.textContent = m + ':' + s;
        if (total < 60) {
          el.style.color = '#FF4D4F';
        } else if (total < 300) {
          el.style.color = '#FFE08A';
        }
        total--;
      }
      tick();
      setInterval(tick, 1000);

      // 支付按钮 -> loading
      var btn = document.getElementById('payBtn');
      var mask = document.getElementById('loadingMask');
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        btn.disabled = true;
        btn.innerHTML = '正在支付...';
        mask.classList.add('show');
        // 模拟 2.5s 后跳转结果页
        setTimeout(function () {
          mask.classList.remove('show');
          btn.disabled = false;
          btn.innerHTML = '确认支付 <span class="amount">¥299.00</span>';
        }, 2500);
      });
    })();
  </script>
</body>
</html>
