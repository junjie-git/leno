<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - Leno 买家端</title>
<style>
  :root {
    --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
    --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
    --r-base:6px; --r-card:8px; --r-lg:12px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
    --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
    --fw-normal:400; --fw-medium:500; --fw-semibold:600;
    --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { font-family: var(--ff-app); color: var(--n10); background:#E5E5E5; -webkit-font-smoothing:antialiased; }
  body { display:flex; justify-content:center; min-height:100vh; }
  .phone {
    width:375px; min-height:812px; background:var(--n2); position:relative;
    box-shadow:0 12px 48px rgba(0,0,0,.15); overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* 状态栏 */
  .status-bar {
    height:44px; padding:0 24px; display:flex; align-items:center; justify-content:space-between;
    font-size:15px; font-weight:var(--fw-semibold); color:var(--n10); flex-shrink:0; background:var(--n1);
  }
  .status-bar .right { display:flex; align-items:center; gap:6px; }
  .status-bar svg { display:block; }
  /* NavBar */
  .navbar {
    height:46px; background:var(--n1); display:flex; align-items:center; padding:0 12px;
    border-bottom:1px solid var(--n3); flex-shrink:0; position:relative;
  }
  .navbar-back {
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    color:var(--n10); cursor:pointer; border:none; background:none;
  }
  .navbar-back:active { opacity:.6; }
  .navbar-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:var(--fs-lg); font-weight:var(--fw-medium); color:var(--n10);
  }
  /* 步骤条 */
  .steps {
    background:var(--n1); padding:24px 16px 20px; display:flex; align-items:center;
  }
  .step-item {
    display:flex; align-items:center; flex:1;
  }
  .step-dot {
    width:28px; height:28px; border-radius:50%; background:var(--n3); color:var(--n7);
    display:flex; align-items:center; justify-content:center; font-size:var(--fs-base);
    font-weight:var(--fw-semibold); flex-shrink:0; transition:all .3s;
  }
  .step-item.active .step-dot { background:var(--c-primary); color:#fff; box-shadow:0 0 0 4px rgba(22,119,255,.12); }
  .step-item.done .step-dot { background:var(--c-primary); color:#fff; }
  .step-item.done .step-dot svg { display:block; }
  .step-dot svg { display:none; }
  .step-label {
    margin-left:8px; font-size:var(--fs-base); color:var(--n7); font-weight:var(--fw-medium);
  }
  .step-item.active .step-label, .step-item.done .step-label { color:var(--n10); }
  .step-line {
    flex:1; height:1px; background:var(--n3); margin:0 8px; position:relative;
  }
  .step-line.done { background:var(--c-primary); }
  /* 内容区 */
  .content { flex:1; overflow-y:auto; padding:24px 16px; }
  .step-panel { display:none; }
  .step-panel.show { display:block; }
  .field { position:relative; margin-bottom:12px; }
  .field-input-wrap {
    display:flex; align-items:center; min-height:52px;
    background:var(--n1); border:1px solid var(--n5); border-radius:var(--r-card);
    padding:0 12px; transition:border-color .2s;
  }
  .field-input-wrap.focused { border-color:var(--c-primary); }
  .field-input-wrap.error { border-color:var(--c-error); }
  .field-icon {
    width:20px; height:20px; color:var(--n7); flex-shrink:0; margin-right:10px;
  }
  .field-input-wrap.focused .field-icon { color:var(--c-primary); }
  .field-input {
    flex:1; border:none; outline:none; background:transparent;
    font-size:var(--fs-lg); color:var(--n10); height:100%; font-family:inherit; padding:14px 0;
  }
  .field-input::placeholder { color:var(--n7); font-size:var(--fs-base); }
  .field-action {
    display:flex; align-items:center; justify-content:center;
    color:var(--n7); cursor:pointer; flex-shrink:0; margin-left:8px;
  }
  .code-btn {
    border:none; background:var(--n3); color:var(--n9);
    font-size:var(--fs-sm); font-family:inherit; padding:6px 10px;
    border-radius:var(--r-base); cursor:pointer; white-space:nowrap; flex-shrink:0; margin-left:8px;
    font-weight:var(--fw-medium);
  }
  .code-btn.active { background:var(--c-primary); color:#fff; }
  .code-btn:disabled { background:var(--n3); color:var(--n7); cursor:not-allowed; }
  .field-error {
    margin-top:6px; padding-left:4px; font-size:var(--fs-sm); color:var(--c-error);
    display:none; align-items:center; gap:4px;
  }
  .field-error.show { display:flex; }
  .field-error svg { width:14px; height:14px; flex-shrink:0; }
  .field-tip {
    margin-top:8px; font-size:var(--fs-sm); color:var(--n7); line-height:1.6; padding-left:4px;
  }
  /* 按钮 */
  .btn-row { display:flex; gap:12px; margin-top:24px; }
  .btn {
    flex:1; height:48px; border:none; border-radius:var(--r-card);
    font-size:var(--fs-lg); font-weight:var(--fw-semibold); font-family:inherit; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .2s;
  }
  .btn:active { opacity:.85; }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .btn-primary { background:var(--c-primary); color:#fff; box-shadow:0 4px 12px rgba(22,119,255,.3); }
  .btn-primary.loading { background:#4096FF; }
  .btn-default { background:var(--n1); color:var(--n10); border:1px solid var(--n5); }
  .btn.block { flex:1; box-shadow:0 4px 12px rgba(22,119,255,.3); }
  .spinner {
    width:18px; height:18px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* Toast */
  .toast-mask {
    position:fixed; inset:0; display:none; align-items:flex-start; justify-content:center;
    z-index:999; pointer-events:none;
  }
  .toast-mask.show { display:flex; }
  .toast {
    margin-top:120px; background:rgba(0,0,0,.85); border-radius:var(--r-card);
    padding:20px 24px; display:flex; flex-direction:column; align-items:center; gap:10px;
    min-width:140px; animation:toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity:0; transform:translateY(-12px);} to {opacity:1; transform:translateY(0);} }
  .toast svg { width:36px; height:36px; }
  .toast-text { color:#fff; font-size:var(--fs-base); text-align:center; }
  /* 状态切换器 */
  .state-switcher {
    position:fixed; right:16px; bottom:24px; z-index:1000;
    background:#fff; border-radius:var(--r-lg); box-shadow:0 4px 20px rgba(0,0,0,.15);
    padding:8px; display:flex; flex-direction:column; gap:6px;
  }
  .state-switcher-title { font-size:11px; color:var(--n7); padding:2px 6px; }
  .state-btn {
    border:1px solid var(--n5); background:var(--n1); border-radius:var(--r-base);
    padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--n9);
  }
  .state-btn.active { background:var(--c-primary); color:#fff; border-color:var(--c-primary); }
</style>
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M1 9h2v2H1zm4-2h2v4H5zm4-2h2v6H9zm4-2h2v8h-2z"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5c2 0 3.8.8 5.2 2L8 0 2.8 4.5C4.2 3.3 6 2.5 8 2.5z" opacity=".4"/><path d="M8 5.5c1.2 0 2.3.5 3.1 1.3L8 5.5 4.9 6.8C5.7 6 6.8 5.5 8 5.5z"/><path d="M8 8.5l-1.6-1.6C6.8 6.5 7.4 6.3 8 6.3s1.2.2 1.6.6L8 8.5z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-opacity=".4"/><rect x="3" y="3" width="14" height="6" rx="1" fill="currentColor"/><rect x="22.5" y="4" width="1.5" height="4" rx=".5" fill="currentColor" fill-opacity=".4"/></svg>
    </span>
  </div>

  <!-- NavBar -->
  <div class="navbar">
    <button class="navbar-back" type="button" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="navbar-title">忘记密码</div>
  </div>

  <!-- 步骤条 -->
  <div class="steps">
    <div class="step-item active" id="step0">
      <div class="step-dot">1</div>
      <div class="step-label">验证身份</div>
    </div>
    <div class="step-line" id="line0"></div>
    <div class="step-item" id="step1">
      <div class="step-dot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        2
      </div>
      <div class="step-label">重置密码</div>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content">
    <!-- Step 0: 验证身份 -->
    <div class="step-panel show" id="panel0">
      <div class="field">
        <div class="field-input-wrap" id="phoneWrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
          <input type="tel" class="field-input" id="phone" placeholder="手机号" maxlength="11" aria-label="手机号" autocomplete="off">
        </div>
        <div class="field-error" id="phoneError">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span>请输入正确的 11 位手机号</span>
        </div>
      </div>
      <div class="field">
        <div class="field-input-wrap" id="codeWrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9c2 0 4 .6 5.5 1.7"/></svg>
          <input type="tel" class="field-input" id="code" placeholder="短信验证码" maxlength="6" aria-label="验证码" autocomplete="off">
          <button class="code-btn active" id="codeBtn" type="button">获取验证码</button>
        </div>
        <div class="field-error" id="codeError">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span>请输入 6 位验证码</span>
        </div>
        <div class="field-tip">验证码将发送至您注册的手机号</div>
      </div>
      <button class="btn btn-primary block" id="nextBtn" type="button">下一步</button>
    </div>

    <!-- Step 1: 重置密码 -->
    <div class="step-panel" id="panel1">
      <div class="field">
        <div class="field-input-wrap" id="newPwdWrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" class="field-input" id="newPwd" placeholder="新密码（6-32 位）" aria-label="新密码" autocomplete="off">
          <span class="field-action" id="newPwdToggle" role="button" aria-label="切换密码可见">
            <svg id="newPwdEye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="field-error" id="newPwdError">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span>密码长度需 6-32 位</span>
        </div>
      </div>
      <div class="field">
        <div class="field-input-wrap" id="confirmPwdWrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M9 15l2 2 4-4"/></svg>
          <input type="password" class="field-input" id="confirmPwd" placeholder="确认新密码" aria-label="确认密码" autocomplete="off">
          <span class="field-action" id="confirmPwdToggle" role="button" aria-label="切换密码可见">
            <svg id="confirmPwdEye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="field-error" id="confirmPwdError">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span>两次输入的密码不一致</span>
        </div>
        <div class="field-tip">新密码不能与旧密码相同</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-default" id="backBtn" type="button">返回上一步</button>
        <button class="btn btn-primary" id="submitBtn" type="button">提交</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-mask" id="toastMask">
  <div class="toast" id="toastBox">
    <svg id="toastIcon" viewBox="0 0 48 48"></svg>
    <div class="toast-text" id="toastText">验证码已发送</div>
  </div>
</div>

<!-- 状态切换器 -->
<div class="state-switcher">
  <div class="state-switcher-title">状态预览</div>
  <button class="state-btn active" data-state="step0">验证身份</button>
  <button class="state-btn" data-state="step1">重置密码</button>
  <button class="state-btn" data-state="countdown">倒计时</button>
  <button class="state-btn" data-state="error">校验错误</button>
  <button class="state-btn" data-state="loading">提交中</button>
  <button class="state-btn" data-state="success">重置成功</button>
</div>

<script>
  var eyeOpen = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
  var eyeClose = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

  function bindField(inputId, wrapId, errId) {
    var inp = document.getElementById(inputId);
    var wrap = document.getElementById(wrapId);
    var err = document.getElementById(errId);
    inp.addEventListener('focus', function(){ wrap.classList.add('focused'); });
    inp.addEventListener('blur', function(){ wrap.classList.remove('focused'); });
    inp.addEventListener('input', function(){ wrap.classList.remove('error'); err.classList.remove('show'); });
  }
  bindField('phone','phoneWrap','phoneError');
  bindField('code','codeWrap','codeError');
  bindField('newPwd','newPwdWrap','newPwdError');
  bindField('confirmPwd','confirmPwdWrap','confirmPwdError');

  function bindEye(toggleId, eyeId, inputId) {
    var visible = false;
    var tog = document.getElementById(toggleId);
    var eye = document.getElementById(eyeId);
    var inp = document.getElementById(inputId);
    tog.addEventListener('click', function(){
      visible = !visible;
      inp.type = visible ? 'text' : 'password';
      eye.innerHTML = visible ? eyeClose : eyeOpen;
    });
  }
  bindEye('newPwdToggle','newPwdEye','newPwd');
  bindEye('confirmPwdToggle','confirmPwdEye','confirmPwd');

  function showErr(wrapId, errId, msg) {
    var wrap = document.getElementById(wrapId);
    var err = document.getElementById(errId);
    wrap.classList.add('error'); err.classList.add('show');
    if (msg) err.querySelector('span').textContent = msg;
  }
  function clearErr(wrapId, errId) {
    document.getElementById(wrapId).classList.remove('error');
    document.getElementById(errId).classList.remove('show');
  }
  function clearAllErr() {
    ['phoneWrap','codeWrap','newPwdWrap','confirmPwdWrap'].forEach(function(w,i){
      var eIds=['phoneError','codeError','newPwdError','confirmPwdError'];
      clearErr(w, eIds[i]);
    });
  }

  // 步骤切换
  var currentStep = 0;
  function setStep(step) {
    currentStep = step;
    document.getElementById('panel0').classList.toggle('show', step===0);
    document.getElementById('panel1').classList.toggle('show', step===1);
    var s0 = document.getElementById('step0');
    var s1 = document.getElementById('step1');
    var line0 = document.getElementById('line0');
    if (step === 0) {
      s0.className='step-item active'; s1.className='step-item'; line0.classList.remove('done');
      s0.querySelector('.step-dot').innerHTML='1';
    } else {
      s0.className='step-item done'; s1.className='step-item active'; line0.classList.add('done');
      s0.querySelector('.step-dot').innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    }
  }

  // 验证码倒计时
  var codeBtn = document.getElementById('codeBtn');
  var countdown = 0, timer = null;
  function startCountdown() {
    countdown = 60;
    codeBtn.disabled = true; codeBtn.classList.remove('active');
    codeBtn.textContent = countdown + 's 后重发';
    timer = setInterval(function(){
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        codeBtn.disabled = false; codeBtn.classList.add('active');
        codeBtn.textContent = '重新获取';
      } else {
        codeBtn.textContent = countdown + 's 后重发';
      }
    }, 1000);
  }
  codeBtn.addEventListener('click', function(){
    if (codeBtn.disabled) return;
    var phone = document.getElementById('phone').value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { showErr('phoneWrap','phoneError','请先输入正确的手机号'); return; }
    startCountdown();
    showToast('验证码已发送', 'success');
  });

  // 下一步
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', function(){
    clearAllErr();
    var phone = document.getElementById('phone').value.trim();
    var code = document.getElementById('code').value.trim();
    var hasErr = false;
    if (!/^1[3-9]\d{9}$/.test(phone)) { showErr('phoneWrap','phoneError'); hasErr=true; }
    if (!/^\d{6}$/.test(code)) { showErr('codeWrap','codeError'); hasErr=true; }
    if (hasErr) return;
    setStep(1);
  });

  // 返回
  document.getElementById('backBtn').addEventListener('click', function(){ setStep(0); });

  // 提交
  var submitBtn = document.getElementById('submitBtn');
  function setSubmitLoading(loading) {
    if (loading) {
      submitBtn.disabled = true; submitBtn.classList.add('loading');
      submitBtn.innerHTML = '<span class="spinner"></span><span>提交中...</span>';
    } else {
      submitBtn.disabled = false; submitBtn.classList.remove('loading');
      submitBtn.innerHTML = '<span>提交</span>';
    }
  }
  submitBtn.addEventListener('click', function(){
    clearAllErr();
    var np = document.getElementById('newPwd').value;
    var cp = document.getElementById('confirmPwd').value;
    var hasErr = false;
    if (np.length < 6 || np.length > 32) { showErr('newPwdWrap','newPwdError'); hasErr=true; }
    if (cp !== np || !cp) { showErr('confirmPwdWrap','confirmPwdError'); hasErr=true; }
    if (hasErr) return;
    setSubmitLoading(true);
    setTimeout(function(){
      setSubmitLoading(false);
      showToast('密码重置成功', 'success');
    }, 1600);
  });

  // Toast
  var successIcon = '<circle cx="24" cy="24" r="22" fill="none" stroke="#52C41A" stroke-width="3"/><polyline points="16 25 21 30 33 18" fill="none" stroke="#52C41A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  var failIcon = '<circle cx="24" cy="24" r="22" fill="none" stroke="#FF4D4F" stroke-width="3"/><line x1="24" y1="14" x2="24" y2="28" stroke="#FF4D4F" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="34" r="2.5" fill="#FF4D4F"/>';
  var toastMask = document.getElementById('toastMask');
  var toastBox = document.getElementById('toastBox');
  var toastIcon = document.getElementById('toastIcon');
  var toastText = document.getElementById('toastText');
  function showToast(text, type) {
    toastText.textContent = text;
    toastIcon.innerHTML = type === 'success' ? successIcon : failIcon;
    toastBox.className = 'toast ' + (type || '');
    toastMask.classList.add('show');
    setTimeout(function(){ toastMask.classList.remove('show'); }, 2200);
  }

  // 状态预览
  var stateBtns = document.querySelectorAll('.state-btn');
  stateBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      stateBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var s = btn.dataset.state;
      clearAllErr();
      setSubmitLoading(false);
      toastMask.classList.remove('show');
      if (timer) { clearInterval(timer); }
      codeBtn.disabled = false; codeBtn.classList.add('active'); codeBtn.textContent='获取验证码';
      ['phone','code','newPwd','confirmPwd'].forEach(function(id){ document.getElementById(id).value=''; });
      document.getElementById('newPwd').type='password'; document.getElementById('confirmPwd').type='password';
      document.getElementById('newPwdEye').innerHTML=eyeOpen; document.getElementById('confirmPwdEye').innerHTML=eyeOpen;

      if (s === 'step0') {
        setStep(0);
      } else if (s === 'step1') {
        document.getElementById('phone').value='13888888888';
        document.getElementById('code').value='836241';
        setStep(1);
      } else if (s === 'countdown') {
        setStep(0);
        document.getElementById('phone').value='13888888888';
        startCountdown();
      } else if (s === 'error') {
        document.getElementById('phone').value='1381234';
        showErr('phoneWrap','phoneError');
        document.getElementById('code').value='12';
        showErr('codeWrap','codeError');
        setStep(0);
      } else if (s === 'loading') {
        document.getElementById('phone').value='13888888888';
        document.getElementById('code').value='836241';
        document.getElementById('newPwd').value='newpass123';
        document.getElementById('confirmPwd').value='newpass123';
        setStep(1);
        setSubmitLoading(true);
      } else if (s === 'success') {
        document.getElementById('phone').value='13888888888';
        document.getElementById('code').value='836241';
        document.getElementById('newPwd').value='newpass123';
        document.getElementById('confirmPwd').value='newpass123';
        setStep(1);
        showToast('密码重置成功','success');
      }
    });
  });
</script>
</body>
</html>
