<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分类导航 - Leno 买家端</title>
<style>
:root{
  --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
  --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
  --r-base:6px; --r-card:8px; --r-lg:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
  --fw-normal:400; --fw-medium:500; --fw-semibold:600;
  --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--ff-app);
  background:#EEF0F3;
  color:var(--n10);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:24px 0;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:24px;}

/* ===== Phone Frame ===== */
.phone{
  width:375px;height:760px;background:var(--n1);
  border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.08);
  display:flex;flex-direction:column;
}
/* ===== Search Header (Area A) ===== */
.search-header{
  height:46px;background:var(--n1);
  border-bottom:1px solid var(--n3);
  display:flex;align-items:center;padding:0 var(--s3);gap:var(--s2);flex-shrink:0;
}
.search-box{
  flex:1;height:32px;background:var(--n3);border-radius:16px;
  display:flex;align-items:center;padding:0 var(--s3);gap:var(--s1);
}
.search-box svg{color:var(--n7);flex-shrink:0;}
.search-box span{font-size:var(--fs-base);color:var(--n7);}

/* ===== Split Body ===== */
.split{flex:1;display:flex;overflow:hidden;}

/* Left sidebar (Area B) */
.sidebar{
  width:80px;background:var(--n3);flex-shrink:0;overflow-y:auto;
  padding:4px 0;
}
.cat-item{
  height:46px;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-base);color:var(--n9);position:relative;
  background:transparent;cursor:pointer;
}
.cat-item.active{
  background:var(--n1);color:var(--c-primary);font-weight:var(--fw-medium);
}
.cat-item.active::before{
  content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;
  background:var(--c-primary);border-radius:0 2px 2px 0;
}

/* Right content (Area C) */
.content{flex:1;overflow-y:auto;background:var(--n1);padding:var(--s3);}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-bottom:var(--s4);}
.sub-cell{
  display:flex;flex-direction:column;align-items:center;gap:var(--s1);
  padding:var(--s2) 0;cursor:pointer;
}
.sub-icon{
  width:48px;height:48px;border-radius:var(--r-lg);background:#E6F4FF;
  display:flex;align-items:center;justify-content:center;color:var(--c-primary);
}
.sub-name{font-size:var(--fs-sm);color:var(--n9);}

.rec-title{
  font-size:var(--fs-base);font-weight:var(--fw-medium);color:var(--n10);
  display:flex;align-items:center;gap:var(--s2);margin:var(--s2) 0 var(--s3);
}
.rec-title::before,.rec-title::after{
  content:"";flex:1;height:1px;background:var(--n3);
}
.waterfall{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);}
.pcard{
  background:var(--n1);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--sh-card);margin-bottom:0;
}
.pcard img{width:100%;display:block;}
.pcard .pc-body{padding:var(--s2);}
.pcard .pc-name{
  font-size:var(--fs-base);color:var(--n10);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:38px;
}
.pcard .pc-price{font-size:var(--fs-lg);color:var(--c-error);font-weight:var(--fw-semibold);margin-top:var(--s1);}
.pcard .pc-sales{font-size:var(--fs-sm);color:var(--n7);margin-top:2px;}

/* product image placeholder */
.pi{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}

/* ===== Tabbar ===== */
.tabbar{
  height:50px;background:var(--n1);border-top:1px solid var(--n3);
  display:flex;flex-shrink:0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--n7);cursor:pointer;
}
.tab.active{color:var(--c-primary);}
.tab .t-label{font-size:10px;line-height:1;}

/* ===== States Preview ===== */
.states-wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.states-cap{font-size:13px;color:var(--n7);text-align:center;margin-bottom:-8px;}
.mini{
  width:200px;height:380px;background:var(--n1);border-radius:14px;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;flex-direction:column;
  border:1px solid var(--n3);
}
.mini .m-head{height:30px;background:var(--n1);border-bottom:1px solid var(--n3);display:flex;align-items:center;padding:0 8px;}
.mini .m-head .m-sb{flex:1;height:18px;background:var(--n3);border-radius:9px;margin:0 6px;}
.mini .m-body{flex:1;display:flex;}
.mini .m-side{width:42px;background:var(--n3);}
.mini .m-side .mc{height:26px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--n9);}
.mini .m-side .mc.on{background:var(--n1);color:var(--c-primary);}
.mini .m-cont{flex:1;padding:6px;}
.mini .m-tag{font-size:9px;color:var(--n7);text-align:center;padding:3px 0;}
.skel{background:linear-gradient(90deg,#f2f2f2 25%,#e6e6e6 37%,#f2f2f2 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.mini .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.mini .m-grid .gi{height:42px;border-radius:5px;}
.mini .m-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px;}
.mini .m-list .li{height:62px;border-radius:6px;}
.empty-mini{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--n7);}
.empty-mini svg{color:var(--n5);}
.err-mini{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--n7);padding:10px;text-align:center;}
.retry-btn{font-size:10px;color:var(--c-primary);border:1px solid var(--c-primary);padding:3px 10px;border-radius:var(--r-base);}
</style>
</head>
<body>
<div class="stage">

  <!-- ============ MAIN PHONE: Category Nav ============ -->
  <div class="phone">
    <!-- Area A: Search Header -->
    <div class="search-header">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>搜索商品</span>
      </div>
    </div>

    <div class="split">
      <!-- Area B: Left sidebar -->
      <div class="sidebar" role="navigation" aria-label="一级分类">
        <div class="cat-item">服装</div>
        <div class="cat-item active" aria-current="page">数码</div>
        <div class="cat-item">食品</div>
        <div class="cat-item">家居</div>
        <div class="cat-item">美妆</div>
      </div>

      <!-- Area C: Right content -->
      <div class="content">
        <!-- 二级分类网格 -->
        <div class="sub-grid">
          <div class="sub-cell">
            <div class="sub-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>
            </div>
            <span class="sub-name">手机</span>
          </div>
          <div class="sub-cell">
            <div class="sub-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            </div>
            <span class="sub-name">电脑</span>
          </div>
          <div class="sub-cell">
            <div class="sub-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 14a8 8 0 0 1 16 0"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>
            </div>
            <span class="sub-name">影音耳机</span>
          </div>
          <div class="sub-cell">
            <div class="sub-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7V5h4v2M13 17v2"/></svg>
            </div>
            <span class="sub-name">智能设备</span>
          </div>
        </div>

        <!-- 为你推荐 -->
        <div class="rec-title">为你推荐</div>
        <div class="waterfall">
          <div class="pcard" aria-label="小米 Redmi Note 13 8+256GB 子夜黑，999元">
            <div class="pi" style="background:linear-gradient(135deg,#1a2a4a,#2d4a7a);">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>
            </div>
            <div class="pc-body">
              <div class="pc-name">小米 Redmi Note 13 8+256GB 子夜黑</div>
              <div class="pc-price">¥999</div>
              <div class="pc-sales">月销 1.2万</div>
            </div>
          </div>
          <div class="pcard" aria-label="华为 FreeBuds Pro 3 真无线降噪耳机，1099元">
            <div class="pi" style="background:linear-gradient(135deg,#3a2a1a,#6a4a2a);">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"><path d="M4 14a8 8 0 0 1 16 0"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>
            </div>
            <div class="pc-body">
              <div class="pc-name">华为 FreeBuds Pro 3 真无线降噪耳机</div>
              <div class="pc-price">¥1099</div>
              <div class="pc-sales">月销 8600</div>
            </div>
          </div>
          <div class="pcard" aria-label="小米手环 8 智能运动手环，239元">
            <div class="pi" style="background:linear-gradient(135deg,#1a3a3a,#2a5a5a);">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M9 4V2h6v2"/></svg>
            </div>
            <div class="pc-body">
              <div class="pc-name">小米手环 8 智能运动手环</div>
              <div class="pc-price">¥239</div>
              <div class="pc-sales">月销 3.4万</div>
            </div>
          </div>
          <div class="pcard" aria-label="绿联 65W 氮化镓快充充电器，99元">
            <div class="pi" style="background:linear-gradient(135deg,#2a1a3a,#4a2a5a);">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M10 13l2 2 4-4"/></svg>
            </div>
            <div class="pc-body">
              <div class="pc-name">绿联 65W 氮化镓快充充电器</div>
              <div class="pc-price">¥99</div>
              <div class="pc-sales">月销 5.2万</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabbar -->
    <div class="tabbar" role="navigation" aria-label="底部导航">
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span class="t-label">首页</span>
      </div>
      <div class="tab active" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="t-label">分类</span>
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 7h14l-1.5 9a2 2 0 0 1-2 1.7H8.5a2 2 0 0 1-2-1.7L5 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
        <span class="t-label">购物车</span>
      </div>
      <div class="tab">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        <span class="t-label">我的</span>
      </div>
    </div>
  </div>

  <!-- ============ STATES PREVIEW ============ -->
  <div class="states-cap">交互状态预览（加载骨架屏 / 空数据 / 错误态）</div>
  <div class="states-wrap">
    <!-- Skeleton -->
    <div class="mini">
      <div class="m-head"><div class="m-sb"></div></div>
      <div class="m-body">
        <div class="m-side">
          <div class="mc skel"></div>
          <div class="mc on skel"></div>
          <div class="mc skel"></div>
          <div class="mc skel"></div>
        </div>
        <div class="m-cont">
          <div class="m-grid">
            <div class="gi skel"></div><div class="gi skel"></div>
            <div class="gi skel"></div><div class="gi skel"></div>
          </div>
          <div class="m-list">
            <div class="li skel"></div><div class="li skel"></div>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--n7);text-align:center;padding:6px;">加载骨架屏</div>
    </div>

    <!-- Empty -->
    <div class="mini">
      <div class="m-head"><div class="m-sb"></div></div>
      <div class="m-body">
        <div class="m-side">
          <div class="mc">服装</div>
          <div class="mc on">数码</div>
          <div class="mc">食品</div>
          <div class="mc">家居</div>
        </div>
        <div class="m-cont" style="display:flex;flex-direction:column;">
          <div class="empty-mini">
            <svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="12" width="32" height="26" rx="3"/><path d="M16 12V8a8 8 0 0 1 16 0v4" stroke-opacity=".5"/></svg>
            <div style="font-size:12px;">该分类下暂无商品</div>
            <div style="font-size:11px;color:var(--c-primary);border:1px solid var(--c-primary);padding:3px 10px;border-radius:var(--r-base);">去逛逛</div>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--n7);text-align:center;padding:6px;">空数据</div>
    </div>

    <!-- Error -->
    <div class="mini">
      <div class="m-head"><div class="m-sb"></div></div>
      <div class="m-body">
        <div class="m-side">
          <div class="mc">服装</div>
          <div class="mc on">数码</div>
          <div class="mc">食品</div>
          <div class="mc">家居</div>
        </div>
        <div class="m-cont" style="display:flex;flex-direction:column;">
          <div class="err-mini">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="var(--c-error)" stroke-width="2"><circle cx="24" cy="24" r="18"/><path d="M24 14v12M24 32v.5" stroke-linecap="round"/></svg>
            <div style="font-size:12px;">分类加载失败</div>
            <div style="font-size:10px;">网络异常，请稍后重试</div>
            <div class="retry-btn">重新加载</div>
          </div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--n7);text-align:center;padding:6px;">错误态</div>
    </div>
  </div>

</div>
</body>
</html>
