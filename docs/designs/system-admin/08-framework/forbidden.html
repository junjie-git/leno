<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 无访问权限 - Leno 系统管理后台</title>
  <style>
    :root {
      --c-primary:#1677FF; --c-success:#52C41A; --c-warning:#FAAD14; --c-error:#FF4D4F;
      --n1:#FFFFFF; --n2:#FAFAFA; --n3:#F5F5F5; --n5:#D9D9D9; --n7:#8C8C8C; --n9:#595959; --n10:#000000D9;
      --r-base:6px; --r-card:8px; --r-lg:12px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
      --fs-sm:12px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
      --fw-normal:400; --fw-medium:500; --fw-semibold:600;
      --ff-app:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --ff-mono:"SF Mono","Cascadia Code",Consolas,monospace;
      --sh-card:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
      --sider-bg:#001529; --sider-width:200px; --header-h:64px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      height:100%;
      font-family:var(--ff-app);
      font-size:var(--fs-base);
      color:var(--n10);
      line-height:1.5715;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .app { min-height:100vh; display:flex; flex-direction:column; }

    /* ===== Header ===== */
    .header {
      height:var(--header-h);
      background:var(--n1);
      border-bottom:1px solid var(--n5);
      display:flex;
      align-items:center;
      padding:0 var(--s6);
      position:sticky;
      top:0;
      z-index:100;
      flex-shrink:0;
    }

    .logo {
      display:flex;
      align-items:center;
      gap:var(--s2);
      width:calc(var(--sider-width) - var(--s6));
      flex-shrink:0;
    }

    .logo-mark {
      width:32px;
      height:32px;
      border-radius:var(--r-base);
      background:linear-gradient(135deg, #1677FF 0%, #0958D9 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:var(--fw-semibold);
      font-size:var(--fs-lg);
      letter-spacing:-0.5px;
    }

    .logo-text {
      font-size:var(--fs-lg);
      font-weight:var(--fw-semibold);
      color:var(--n10);
    }

    .logo-text span {
      color:var(--n7);
      font-weight:var(--fw-normal);
      font-size:var(--fs-sm);
      margin-left:var(--s2);
    }

    .breadcrumb {
      display:flex;
      align-items:center;
      gap:var(--s2);
      font-size:var(--fs-base);
      color:var(--n7);
      margin-left:var(--s4);
    }

    .breadcrumb .crumb-current { color:var(--n10); }
    .breadcrumb .sep { color:var(--n5); font-size:12px; }

    .header-right {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:var(--s4);
    }

    .icon-btn {
      width:36px;
      height:36px;
      border-radius:var(--r-base);
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--n9);
      position:relative;
      transition:background 100ms cubic-bezier(0.2,0,0,1);
    }

    .icon-btn:hover { background:var(--n3); }

    .icon-btn .dot {
      position:absolute;
      top:6px;
      right:6px;
      min-width:16px;
      height:16px;
      padding:0 4px;
      border-radius:8px;
      background:var(--c-error);
      color:#fff;
      font-size:10px;
      font-weight:var(--fw-semibold);
      line-height:16px;
      text-align:center;
      border:2px solid var(--n1);
      box-sizing:content-box;
    }

    .user-menu {
      display:flex;
      align-items:center;
      gap:var(--s2);
      padding:var(--s1) var(--s2) var(--s1) var(--s1);
      border-radius:var(--r-base);
      cursor:pointer;
      transition:background 100ms cubic-bezier(0.2,0,0,1);
    }

    .user-menu:hover { background:var(--n3); }

    .avatar {
      width:32px;
      height:32px;
      border-radius:50%;
      background:linear-gradient(135deg, #FAAD14 0%, #D48806 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:var(--fs-sm);
      font-weight:var(--fw-semibold);
    }

    .user-name { font-size:var(--fs-base); color:var(--n10); }

    /* ===== Body ===== */
    .body { flex:1; display:flex; min-height:0; }

    /* ===== Sider ===== */
    .sider {
      width:var(--sider-width);
      background:var(--sider-bg);
      flex-shrink:0;
      display:flex;
      flex-direction:column;
      padding:var(--s4) 0;
    }

    .menu-item {
      display:flex;
      align-items:center;
      gap:var(--s3);
      height:40px;
      padding:0 var(--s6);
      color:rgba(255,255,255,0.65);
      font-size:var(--fs-base);
      cursor:pointer;
      transition:all 100ms cubic-bezier(0.2,0,0,1);
      border-left:3px solid transparent;
      margin:2px 0;
    }

    .menu-item:hover { color:#fff; background:rgba(255,255,255,0.04); }
    .menu-item .m-icon { width:16px; height:16px; flex-shrink:0; }

    .menu-item.is-locked {
      color:rgba(255,255,255,0.35);
      cursor:not-allowed;
    }

    .menu-item.is-locked:hover { background:transparent; }

    .menu-item .lock-tag {
      margin-left:auto;
      font-size:10px;
      color:rgba(255,255,255,0.35);
    }

    .menu-group-title {
      padding:var(--s6) var(--s6) var(--s2);
      color:rgba(255,255,255,0.35);
      font-size:var(--fs-sm);
      letter-spacing:0.3px;
    }

    .sider-footer {
      margin-top:auto;
      padding:var(--s4) var(--s6);
      color:rgba(255,255,255,0.3);
      font-size:var(--fs-sm);
      border-top:1px solid rgba(255,255,255,0.06);
    }

    /* ===== Content ===== */
    .content {
      flex:1;
      background:var(--n3);
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .content-scroll {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:var(--s8) var(--s6);
      overflow:auto;
    }

    /* ===== Error Card ===== */
    .error-card {
      background:var(--n1);
      border-radius:var(--r-lg);
      box-shadow:var(--sh-card);
      padding:var(--s12) var(--s12);
      max-width:640px;
      width:100%;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .error-card::before {
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:4px;
      background:var(--c-error);
    }

    .illustration {
      width:200px;
      height:160px;
      margin:0 auto var(--s6);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .error-code {
      font-size:120px;
      font-weight:var(--fw-semibold);
      color:var(--c-error);
      line-height:1;
      letter-spacing:-4px;
      font-family:var(--ff-mono);
      margin-bottom:var(--s4);
      background:linear-gradient(180deg, #FF4D4F 0%, #FF7875 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .error-title {
      font-size:var(--fs-2xl);
      font-weight:var(--fw-semibold);
      color:var(--n10);
      margin-bottom:var(--s3);
    }

    .error-desc {
      font-size:var(--fs-base);
      color:var(--n7);
      line-height:1.5715;
      max-width:440px;
      margin:0 auto var(--s4);
    }

    .error-desc strong { color:var(--n9); font-weight:var(--fw-medium); }

    .role-tag {
      display:inline-flex;
      align-items:center;
      gap:var(--s1);
      padding:2px var(--s2);
      background:var(--n3);
      border-radius:4px;
      font-size:var(--fs-sm);
      color:var(--n9);
      margin-top:var(--s2);
      font-family:var(--ff-mono);
    }

    .action-group {
      display:flex;
      justify-content:center;
      gap:var(--s3);
      margin-top:var(--s6);
    }

    .btn {
      height:36px;
      padding:0 var(--s4);
      border-radius:var(--r-base);
      font-size:var(--fs-base);
      font-weight:var(--fw-normal);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:var(--s2);
      transition:all 100ms cubic-bezier(0.2,0,0,1);
      border:1px solid transparent;
      font-family:inherit;
      line-height:1;
    }

    .btn-primary {
      background:var(--c-primary);
      color:#fff;
      border-color:var(--c-primary);
      box-shadow:0 2px 0 rgba(5,145,255,0.1);
    }

    .btn-primary:hover { background:#4096FF; border-color:#4096FF; }
    .btn-primary:active { background:#0958D9; border-color:#0958D9; }

    .btn-default {
      background:var(--n1);
      color:var(--n10);
      border-color:var(--n5);
    }

    .btn-default:hover { color:var(--c-primary); border-color:var(--c-primary); }
    .btn .b-icon { width:14px; height:14px; }

    .hint-row {
      margin-top:var(--s6);
      padding-top:var(--s4);
      border-top:1px dashed var(--n5);
      font-size:var(--fs-sm);
      color:var(--n7);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:var(--s2);
      flex-wrap:wrap;
    }

    .hint-row a { color:var(--c-primary); text-decoration:none; }
    .hint-row a:hover { text-decoration:underline; }

    /* ===== Footer ===== */
    .footer {
      height:32px;
      background:var(--n1);
      border-top:1px solid var(--n3);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 var(--s6);
      font-size:var(--fs-sm);
      color:var(--n7);
      flex-shrink:0;
    }

    .footer .env-tag {
      font-family:var(--ff-mono);
      background:var(--n3);
      padding:1px 6px;
      border-radius:4px;
      color:var(--n9);
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }
    .error-card { animation:cardIn 300ms cubic-bezier(0,0,0,1); }

    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-4px); }
    }
    .illustration svg { animation:float 3s ease-in-out infinite; }

    @keyframes lockShake {
      0%,100% { transform:rotate(0); }
      25% { transform:rotate(-3deg); }
      75% { transform:rotate(3deg); }
    }
    .lock-body { transform-origin:center; animation:lockShake 4s ease-in-out infinite; }
  </style>
</head>
